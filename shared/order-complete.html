<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주문 완료</title>
    <link rel="stylesheet" href="../shared/css/common.css" />
    <link rel="stylesheet" href="../shared/css/complete.css" />
    <script src="../shared/js/common.js" defer></script>
  </head>
  <body>
    <div class="kiosk-screen complete-screen">
      <header id="category-header" class="cafe__header parking__header">
        <div class="header-left">
          <!-- <button
            type="button"
            id="header-back"
            class="header-back"
            aria-label="이전 화면으로"
          >
            <img
              src="../../shared/images/icon/arrow-back.png"
              class="arrow-back"
              alt="뒤로가기 화살표"
            />
          </button> -->
          <a href="../../index.html" aria-label="처음으로">
            <img
              src="../../shared/images/icon/icon-home.png"
              alt=""
              class="category-header-home"
            />
          </a>

          <img
            src="../../shared/images/icon/arrow-right-w.png"
            alt=""
            class="category-header-arrow-right"
          />

          <span id="header-title"></span>
        </div>
        <!-- <div class="header-right"> -->
        <button
          type="button"
          class="header-sound-toggle"
          aria-label="소리"
          aria-pressed="true"
          data-sound-off-src="../../shared/images/icon/sound_w_off.png"
        >
          <img
            src="../../shared/images/icon/sound_w.png"
            class="header-sound"
            alt=""
          />
        </button>
        <!-- </div> -->
      </header>
      <main class="complete-main order-complete">
        <div class="complete-main-contents">
          <div class="complete-text-area">
            <h1 class="complete-title">주문이 완료되었습니다.</h1>
            <p class="complete-message">
              주문번호를 확인해주세요.<br />주문 번호 확인 후 카운터에서
              픽업해주세요.
            </p>
          </div>
          <img
            src="../shared/images/order-number.png"
            class="complete-order-image"
            alt="주문완료 이미지"
          />
        </div>
        <footer class="complete-footer">
          <a
            id="complete-confirm"
            class="complete-button"
            href="./experience-complete.html"
            data-keep-category
            >확인</a
          >
        </footer>
      </main>
    </div>
    <script>
      if (
        new URLSearchParams(window.location.search).get("orderImage") === "red"
      ) {
        document
          .querySelector(".complete-order-image")
          ?.setAttribute("src", "../shared/images/order-number-red.png");
        const completeButton = document.querySelector(".complete-button");
        completeButton?.style.setProperty("background-color", "#DF3C3C");
        if (completeButton) {
          const nextUrl = new URL(completeButton.href, window.location.href);
          nextUrl.searchParams.set("orderImage", "red");
          completeButton.href = nextUrl.href;
        }
      }
    </script>
  </body>
</html>
