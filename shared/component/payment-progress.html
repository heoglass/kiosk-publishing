<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>결제 진행 중 | 카페</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../../pages/cafe/cafe.css" />
  </head>
  <body class="modal-payment">
    <dialog
      open
      id="modal-payment-progress"
      class="modal modal--payment-status"
      aria-labelledby="payment-progress-title"
      aria-describedby="payment-progress-description"
    >
      <div class="modal-body">
        <img
          src="../images/icon/icon-loading.png"
          class="payment-spinner"
          aria-hidden="true"
          alt=""
        />

        <h2 id="payment-progress-title" class="modal-title">
          결제 진행중입니다
        </h2>

        <p id="payment-progress-description" class="payment-status-description">
          카드를 제거하지 말고 잠시만 기다려주세요
        </p>
      </div>
    </dialog>
  </body>
</html>
