<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>포인트 적립 완료 | 카페</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../../pages/cafe/cafe.css" />
  </head>
  <body class="modal-payment">
    <dialog
      open
      id="modal-points-complete"
      class="modal modal--points-complete"
      aria-labelledby="points-complete-title"
    >
      <div class="modal-body">
        <img
          src="../images/icon/icon-coin-saving.png"
          alt=""
          class="coin-saving-image"
        />
        <h2 id="points-complete-title" class="modal-title">
          적립이 완료되었습니다.
        </h2>

        <span class="points-complete-check" aria-hidden="true">✓</span>

        <button type="button" class="points-confirm" data-open-receipt="">
          확인
        </button>
      </div>
    </dialog>
    <script>
      document
        .querySelector(".points-confirm")
        ?.addEventListener("click", () => {
          window.location.href = "./receipt.html";
        });
    </script>
  </body>
</html>
