<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>카드 결제 안내 | 카페</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../../pages/cafe/cafe.css" />
  </head>
  <body class="modal-payment">
    <dialog
      open
      id="modal-card-payment"
      class="modal modal--card"
      aria-labelledby="modal-card-payment-title"
    >
      <div class="modal-header">
        <h2 id="modal-card-payment-title" class="modal-title">카드 결제</h2>

        <button
          type="button"
          class="modal-close"
          data-modal-close=""
          aria-label="닫기"
        >
          <img
            src="../images/icon/close_w.png"
            class="modal-close-image"
            alt=""
            aria-hidden="true"
          />
        </button>
      </div>
      <button
        type="button"
        class="payment-image-button"
        data-card-inserted=""
        aria-label="카드 삽입"
      >
        <img
          class="card-payment-image card-insert"
          src="../images/icon/icon-insert-card.png"
          alt=""
        />
      </button>

      <div class="modal-body">
        <p class="card-payment-guide">카드를 투입구에 넣어주세요.</p>

        <p class="card-payment-description">
          삼성/애플페이로 결제시 결제화면을 실행 후<br />
          <strong>휴대폰을 투입구 가까이</strong>에 갖다대세요.
        </p>

        <dl class="card-payment-summary">
          <div class="card-payment-summary-row">
            <dt>총 수량</dt>
            <dd class="card-payment-count">2개</dd>
          </div>

          <div class="card-payment-summary-row">
            <dt>총 결제금액</dt>
            <dd class="card-payment-total">5,200원</dd>
          </div>
        </dl>
      </div>
    </dialog>
    <script>
      document
        .querySelector("[data-card-inserted]")
        ?.addEventListener("click", () => {
          window.location.href = "./payment-progress.html";
        });
    </script>
  </body>
</html>
