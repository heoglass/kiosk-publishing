<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>포인트 적립 여부 | 카페</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../../pages/cafe/cafe.css" />
  </head>
  <body class="modal-payment">
    <dialog
      open
      id="modal-points-prompt"
      class="modal modal--points-prompt"
      aria-labelledby="points-prompt-title"
    >
      <div class="modal-header">
        <h2 id="points-prompt-title" class="modal-title">적립안내</h2>

        <button
          type="button"
          class="modal-close"
          data-modal-close=""
          aria-label="닫기"
        >
          <img
            src="../images/icon/close_w.png"
            class="modal-close-image"
            alt=""
            aria-hidden="true"
          />
          <span>닫기</span>
        </button>
      </div>

      <div class="modal-body">
        <p class="points-prompt-description">
          포인트를<br />
          적립하시겠습니까?
        </p>

        <form method="dialog" class="points-prompt-actions">
          <button type="submit" class="points-no" value="no">아니오</button>
          <button type="submit" class="points-yes" value="yes">예</button>
        </form>
      </div>
    </dialog>
  </body>
</html>
