<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>체험 완료</title>
    <link rel="stylesheet" href="../shared/css/common.css" />
    <link rel="stylesheet" href="../shared/css/complete.css" />
    <script src="../shared/js/common.js" defer></script>
  </head>
  <body>
    <div class="kiosk-screen complete-screen">
      <header id="category-header" class="=parking__header">
        <div class="header-left">
          <!-- <button
            type="button"
            id="header-back"
            class="header-back"
            aria-label="이전 화면으로"
          >
            <img
              src="../shared/images/icon/arrow-back.png"
              class="arrow-back"
              alt="뒤로가기 화살표"
            />
          </button> -->
          <a href="../../index.html" aria-label="처음으로">
            <img
              src="../shared/images/icon/icon-home.png"
              alt=""
              class="category-header-home"
            />
          </a>

          <img
            src="../shared/images/icon/arrow-right-w.png"
            alt=""
            class="category-header-arrow-right"
          />

          <span id="header-title"></span>
        </div>
        <!-- <div class="header-right"> -->
        <button
          type="button"
          class="header-sound-toggle"
          aria-label="소리"
          aria-pressed="true"
          data-sound-off-src="../shared/images/icon/sound_w_off.png"
        >
          <img
            src="../shared/images/icon/sound_w.png"
            class="header-sound"
            alt=""
          />
        </button>
        <!-- </div> -->
      </header>
      <main class="complete-main experience-complete">
        <div class="complete-main-contents">
          <div class="complete-text-area">
            <h1 class="complete-title">체험 완료</h1>
            <p class="complete-message">
              키오스크 체험이 완료되었습니다.<br />수고하셨습니다.
            </p>
          </div>
          <img
            src="../shared/images/experience-complete.png"
            class="complete-experience-image"
            alt="키오스크 체험 완료"
          />
        </div>
        <div class="complete-actions" aria-label="체험 완료 후 이동">
          <button
            type="button"
            id="experience-retry"
            class="complete-button complete-button-secondary"
          >
            다시하기
          </button>
          <a class="complete-button" href="../index.html">첫 화면으로 가기</a>
        </div>
      </main>
    </div>
    <script>
      if (
        new URLSearchParams(window.location.search).get("orderImage") === "red"
      ) {
        document
          .querySelector(".complete-experience-image")
          ?.setAttribute("src", "../shared/images/experience-complete-red.png");
        document
          .querySelector(
            ".experience-complete .complete-button:not(.complete-button-secondary)"
          )
          ?.style.setProperty("background-color", "#DF3C3C");
      }
    </script>
  </body>
</html>
