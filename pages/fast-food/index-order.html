<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>패스트푸드 - 메뉴선택</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="../../shared/css/common.css" />
  <link rel="stylesheet" href="./fast-food.css" />
  <script type="text/javascript" src="../../shared/js/common.js"></script>

  <!-- CDN링크 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>

<body id="index-fast-order">
  <div class="foodcourt-container">
    <main class="category-main fast__food fast__food--menu">
      <header id="category-header" class="fastFood__header">
        <div class="header-left">
          <!-- <button
            type="button"
            id="header-back"
            class="header-back"
            aria-label="이전 화면으로"
          >
            <img
              src="../../shared/images/icon/arrow-back.png"
              class="arrow-back"
              alt="뒤로가기 화살표"
            />
          </button> -->
          <a href="../../index.html" aria-label="처음으로">
            <img
              src="../../shared/images/icon/icon-home.png"
              alt=""
              class="category-header-home"
            />
          </a>

          <img
            src="../../shared/images/icon/arrow-right-w.png"
            alt=""
            class="category-header-arrow-right"
          />

          <span id="header-title"></span>
        </div>
        <button
          type="button"
          class="header-sound-toggle"
          aria-label="소리"
          aria-pressed="true"
          data-sound-off-src="../../shared/images/icon/sound_w_off.png"
        >
          <img
            src="../../shared/images/icon/sound_w.png"
            class="header-sound"
            alt=""
          />
        </button>
      </header>
      <section class="fastfood__section fastfood__section--menu">
        <!-- 상단 카테고리 NAV 탭 -->
        <nav class="foodcourt__nav">
          <ul class="menu-list">
            <li class="menu-item">
              <button type="button" class="nav__tab nav__tab--active" data-item-type="all">
                <span>전체</span>
              </button>
            </li>
            <li class="menu-item">
              <button type="button" class="nav__tab" data-item-type="burger">
                <span>버거</span>
              </button>
            </li>
            <li class="menu-item">
              <button type="button" class="nav__tab" data-item-type="snack">
                <span>스낵</span>
              </button>
            </li>
            <li class="menu-item">
              <button type="button" class="nav__tab" data-item-type="side">
                <span>사이드</span>
              </button>
            </li>
          </ul>
        </nav>

        <!-- 탭 컨텐츠 영역 -->
        <div class="foodcourt__contents">

          <!-- 1. 한식 탭 컨텐츠 -->
          <div class="foodcourt__content foodcourt__content--active">
            <div class="swiper product-swiper">
              <div class="swiper-wrapper">
                <!-- 페이지 1 (메뉴 6개) -->
                <div class="swiper-slide">
                  <ul class="product-grid">
                    <li class="product-card" item-type="burger" data-name="불고기버거" data-price="6000" data-has-option="true">
                      <div class="product-card__thumb">
                        <img src="../../shared/images/fast-food/bulgogi.png" alt="불고기버거" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">불고기버거</span>
                        <span class="product-card__price">6,000원</span>
                      </div>
                    </li>

                    <li class="product-card" item-type="burger" data-name="새우버거" data-price="5000">
                      <div class="product-card__thumb">
                        <img src="../../shared/images/fast-food/shrimp.png" alt="새우버거" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">새우버거</span>
                        <span class="product-card__price">5,000원</span>
                      </div>
                    </li>

                    <li class="product-card" item-type="burger" data-name="치즈버거" data-price="5000">
                      <div class="product-card__thumb">
                        <img src="../../shared/images/fast-food/cheeze.png" alt="치즈버거" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">치즈버거</span>
                        <span class="product-card__price">5,000원</span>
                      </div>
                    </li>

                    <li class="product-card" item-type="burger" data-name="치킨버거" data-price="4500">
                      <div class="product-card__thumb">
                        <img src="../../shared/images/fast-food/chiken.png" alt="치킨버거" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">치킨버거</span>
                        <span class="product-card__price">4,500원</span>
                      </div>
                    </li>

                    <li class="product-card" item-type="snack" data-name="애플파이" data-price="3000">
                      <div class="product-card__thumb">
                        <img src="../../shared/images/fast-food/apple.png" alt="애플파이" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">애플파이</span>
                        <span class="product-card__price">3,000원</span>
                      </div>
                    </li>

                    <li class="product-card" item-type="side" data-name="치킨너겟" data-price="3000">
                      <div class="product-card__thumb">
                        <img src="../../shared/images/fast-food/nurget.png" alt="치킨너겟" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">치킨너겟</span>
                        <span class="product-card__price">3,000원</span>
                      </div>
                    </li>
                  </ul>
                </div>
                <!-- 페이지 2 (6개 초과 시 다음 슬라이드로) -->
                <div class="swiper-slide">
                  <ul class="product-grid">
                    <li class="product-card" item-type="burger" data-name="불고기 버거 세트" data-price="12000">
                      <div class="product-card__thumb">
                        <img src="../../shared/images/fast-food/buger_set.png" alt="불고기 버거 세트" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">불고기 버거 세트</span>
                        <span class="product-card__price">12,000원</span>
                      </div>
                    </li>
                    
                  </ul>
                </div>
              </div>

              <!-- 하단 슬라이드 이전/다음 버튼 (해당 탭 전용) -->
              <div class="slider-controls">
                <button type="button" class="slider-controls__btn slider-controls__btn--prev">이전</button>
                <div class="swiper-pagination"></div>
                <button type="button" class="slider-controls__btn slider-controls__btn--next">다음</button>
              </div>
            </div>
          </div>

          <!-- 2. 양식 탭 컨텐츠 -->
          <div class="foodcourt__content">
            <div class="swiper product-swiper">
              <div class="swiper-wrapper">
                <div class="swiper-slide">
                  <ul class="product-grid">
                    <li class="product-card">
                      <div class="product-card__thumb">
                        <img src="/shared/images/foodcourt/menu_6.png" alt="까르보나라" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">까르보나라</span>
                        <span class="product-card__price">10,000원</span>
                      </div>
                    </li>
                    <li class="product-card">
                      <div class="product-card__thumb">
                        <img src="/shared/images/foodcourt/menu_6.png" alt="까르보나라" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">까르보나라</span>
                        <span class="product-card__price">10,000원</span>
                      </div>
                    </li>
                    <li class="product-card">
                      <div class="product-card__thumb">
                        <img src="/shared/images/foodcourt/menu_6.png" alt="까르보나라" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">까르보나라</span>
                        <span class="product-card__price">10,000원</span>
                      </div>
                    </li>
                    <li class="product-card">
                      <div class="product-card__thumb">
                        <img src="/shared/images/foodcourt/menu_6.png" alt="까르보나라" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">까르보나라</span>
                        <span class="product-card__price">10,000원</span>
                      </div>
                    </li>
                    <li class="product-card">
                      <div class="product-card__thumb">
                        <img src="/shared/images/foodcourt/menu_6.png" alt="까르보나라" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">까르보나라</span>
                        <span class="product-card__price">10,000원</span>
                      </div>
                    </li>
                  </ul>
                </div>
              </div>

              <div class="slider-controls">
                <button type="button" class="slider-controls__btn slider-controls__btn--prev">이전</button>
                <div class="swiper-pagination"></div>
                <button type="button" class="slider-controls__btn slider-controls__btn--next">다음</button>
              </div>
            </div>
          </div>

          <!-- 3. 중식 탭 컨텐츠 -->
          <div class="foodcourt__content">
            <div class="swiper product-swiper">
              <div class="swiper-wrapper">
                <div class="swiper-slide">
                  <ul class="product-grid">
                    <li class="product-card">
                      <div class="product-card__thumb">
                        <img src="/shared/images/foodcourt/menu_5.png" alt="까르보나라" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">짜장면+탕수육</span>
                        <span class="product-card__price">10,000원</span>
                      </div>
                    </li>
                    <li class="product-card">
                      <div class="product-card__thumb">
                        <img src="/shared/images/foodcourt/menu_5.png" alt="까르보나라" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">짜장면+탕수육</span>
                        <span class="product-card__price">10,000원</span>
                      </div>
                    </li>
                  </ul>
                </div>
              </div>
              <div class="slider-controls">
                <button type="button" class="slider-controls__btn slider-controls__btn--prev">이전</button>
                <div class="swiper-pagination"></div>
                <button type="button" class="slider-controls__btn slider-controls__btn--next">다음</button>
              </div>
            </div>
          </div>

          <!-- 4. 일식 탭 컨텐츠 -->
          <div class="foodcourt__content">
            <div class="swiper product-swiper">
              <div class="swiper-wrapper">
                <div class="swiper-slide">
                  <ul class="product-grid">
                    <li class="product-card">
                      <div class="product-card__thumb">
                        <img src="/shared/images/foodcourt/menu_5.png" alt="까르보나라" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">짜장면+탕수육</span>
                        <span class="product-card__price">10,000원</span>
                      </div>
                    </li>
                  </ul>
                </div>
              </div>
              <div class="slider-controls">
                <button type="button" class="slider-controls__btn slider-controls__btn--prev">이전</button>
                <div class="swiper-pagination"></div>
                <button type="button" class="slider-controls__btn slider-controls__btn--next">다음</button>
              </div>
            </div>
          </div>

        </div>
      </section>
      <div class="dividing-line"></div>

      <!-- 선택된 메뉴 -->
      <section class="cart-section cart__section--selected" aria-label="주문 내역">
          <ul class="cart-list" tabindex="0" aria-label="선택한 상품 목록"></ul>
          <template id="cart-item-template">
            <li class="cart-item">
              <span class="cart-item-name">예시 상품</span>

              <div class="cart-quantity" role="group">
                <button type="button" class="cart-decrease" aria-label="수량 줄이기" disabled>
                  <img src="../../shared/images/icon/minus-disabled.png" class="cart-minus-image" alt="">
                </button>

                <input class="cart-quantity-value" type="number" aria-label="수량" min="1" step="1" value="1" />

                <button type="button" class="cart-increase" aria-label="수량 늘리기">
                  <img src="../../shared/images/icon/plus.png" class="cart-plus-image" alt="">
                </button>
              </div>

              <span class="cart-item-price">2,000원</span>

              <button type="button" class="cart-remove" aria-label="예시 상품 삭제">
                <span aria-hidden="true">삭제</span>
              </button>
            </li>
          </template>
      </section>

      <!-- 하단 버튼 -->
      <section id="foodcourt__oderbar" class="order-bar" aria-label="주문 관리">
        <button type="button" class="cart-clear" disabled>전체삭제</button>

        <button type="button" class="order-submit oder__fastfood" disabled>
          <span class="order-count">0개</span>
          <span class="order-total">0원</span>
          <span class="order-label">주문하기</span>
        </button>
      </section>
    </main>
  </div>

  <div id="option-modal" class="fastfood-composition-modal" style="display: none;">
    <section class="fastfood-composition-modal__panel" role="dialog" aria-modal="true" aria-labelledby="composition-title">
      <h2 id="composition-title" class="fastfood-composition-modal__title">원하시는 구성을 선택해주세요</h2>
      <div class="fastfood-composition-modal__options">
        <label class="fastfood-composition-option fastfood-composition-option--selected">
          <input type="radio" name="food-option" value="세트" data-product-name="불고기 버거 세트" data-product-price="12000" checked>
          <img src="../../shared/images/fast-food/buger_set.png" alt="" class="fastfood-composition-option__image">
          <span class="fastfood-composition-option__info">
            <span class="fastfood-composition-option__name">불고기 버거 세트</span>
            <span class="fastfood-composition-option__description">불고기 버거+프렌치프라이+콜라</span>
            <span class="fastfood-composition-option__price">12,000원</span>
          </span>
        </label>
        <label class="fastfood-composition-option">
          <input type="radio" name="food-option" value="단품" data-product-name="불고기버거" data-product-price="6000">
          <img src="../../shared/images/fast-food/bulgogi.png" alt="" class="fastfood-composition-option__image">
          <span class="fastfood-composition-option__info">
            <span class="fastfood-composition-option__name">불고기 버거</span>
            <span class="fastfood-composition-option__description">불고기 버거 단품</span>
            <span class="fastfood-composition-option__price">6,000원</span>
          </span>
        </label>
      </div>
      <div class="fastfood-composition-modal__buttons">
        <button type="button" id="modal-cancel" class="fastfood-composition-modal__button fastfood-composition-modal__button--cancel">취소</button>
        <button type="button" id="modal-confirm" class="fastfood-composition-modal__button fastfood-composition-modal__button--confirm">선택 완료</button>
      </div>
    </section>
  </div>
    <script type="text/javascript" src="./fast-food-ui.js"></script>
  <!-- CDN -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</body>

</html>
