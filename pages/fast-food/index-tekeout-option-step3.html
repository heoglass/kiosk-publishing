<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>패스트푸드 03 세트메뉴 구성 내역 확인</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="../../shared/css/common.css" />
  <link rel="stylesheet" href="./fast-food.css?v=20261109-set-side" />
  <script type="text/javascript" src="../../shared/js/common.js"></script>
  <script type="text/javascript" src="./fast-food-ui.js?v=20261109-set-side"></script>

</head>

<body id="index-option-step3">
  <div class="foodcourt-container">
    <main class="fast-food category-main fastfood-set-side-page">
      <header id="category-header" class="fastFood__header">
        <div class="header-left">
          <!-- <button
            type="button"
            id="header-back"
            class="header-back"
            aria-label="이전 화면으로"
          >
            <img
              src="../../shared/images/icon/arrow-back.png"
              class="arrow-back"
              alt="뒤로가기 화살표"
            />
          </button> -->
          <a href="../../index.html" aria-label="처음으로">
            <img
              src="../../shared/images/icon/icon-home.png"
              alt=""
              class="category-header-home"
            />
          </a>

          <img
            src="../../shared/images/icon/arrow-right-w.png"
            alt=""
            class="category-header-arrow-right"
          />

          <span id="header-title"></span>
        </div>
        <button
          type="button"
          class="header-sound-toggle"
          aria-label="소리"
          aria-pressed="true"
          data-sound-off-src="../../shared/images/icon/sound_w_off.png"
        >
          <img
            src="../../shared/images/icon/sound_w.png"
            class="header-sound"
            alt=""
          />
        </button>
      </header>
      <section class="fastfood__section fastfood__section--tekeout fastfood-set-side">
        <div class="fastfood-set-side__summary">
          <div class="fastfood-set-side__summary-info option__list--selected">
            <h1 class="fastfood-set-side__product-name">내역을 확인해주세요</h1>
          </div>
        </div>

        <!-- 세트메뉴 구성 내역 리스트 -->
        <div class="fastfood-set-confirmation__list" aria-label="선택한 세트 메뉴 구성">
          <div class="fastfood-set-confirmation__item">
            <img class="fastfood-set-confirmation__image" src="../../shared/images/fast-food/bulgogi.png" alt="" />
            <span class="fastfood-set-confirmation__item-name">아이스 아메리카노</span>
          </div>
          <div class="fastfood-set-confirmation__item">
            <img class="fastfood-set-confirmation__image" src="../../shared/images/fast-food/bulgogi.png" alt="" />
            <span class="fastfood-set-confirmation__item-name">프렌치프라이</span>
          </div>
        </div>

        <div class="fastfood-set-confirmation__total">
          <span class="fastfood-set-confirmation__product-name">불고기 버거 세트</span>
          <span class="fastfood-set-confirmation__product-price">12,000원</span>
        </div>
      </section>
      <nav class="fastfood-set-side__navigation fastfood-set-confirmation__actions" aria-label="세트메뉴 구성 내역 취소 및 담기">
        <button type="button" id="set-side-back" class="fastfood-set-confirmation__button fastfood-set-confirmation__button--cancel">
          취소
        </button>
        <button type="button" id="set-side-next" class="fastfood-set-confirmation__button fastfood-set-confirmation__button--add">
          담기
        </button>
      </nav>
    </main>
  </div>

  <!-- CDN -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</body>

</html>
