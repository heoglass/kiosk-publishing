<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>편의점 택배</title>
    <link rel="stylesheet" href="../../shared/css/LocalCommon.css" />
    <link rel="stylesheet" href="./percel.css" />
    <script type="text/javascript" src="./percel.js"></script>
  </head>
  <body id="parcelBody" data-page="index">
    <main class="parcel-main kiosk-screen">
        <!-- 세로형 공통헤더 -->
        <header id="category-header-vertical" class="parcel__header">
            <div class="header-left">
              <a href="../../index.html" aria-label="처음으로">
                <img
                  src="../../shared/images/icon/icon-home.png"
                  alt=""
                  class="category-header-home"
                />
              </a>
              <img
                src="../../shared/images/icon/arrow-right-w.png"
                alt=""
                class="category-header-arrow-right"
              />

              <span id="header-title"></span>
            </div>
            <!-- <div class="header-right"> -->
            <button
              type="button"
              class="header-sound-toggle"
              aria-label="소리"
              aria-pressed="true"
              data-sound-off-src="../../shared/images/icon/sound_w_off.png"
            >
              <img src="../../shared/images/icon/sound_w.png" class="header-sound" alt="" />
            </button>
            <!-- </div> -->
        </header>

        <section class="parcel__content parcel__content--index">
            <div class="parcel-title">
              <h2 class="parcel-title__main">택배를 접수하시겠어요?</h2>
            </div>
            <div class="receipt-select">
              <a href="./indexMemberType.html" class="receipt-card is-selected">
                <img src="../../shared/images/parcel/user_multi.png" alt="현장 접수" class="receipt-card__icon" />
                <span class="receipt-card__title">현장 접수</span>
                <span class="receipt-card__desc">이 점포에서 접수</span>
              </a>
              <a href="javascript:void(0);" class="receipt-card">
                <img src="../../shared/images/parcel/percent-card.png" alt="예약접수" class="receipt-card__icon" />
                <span class="receipt-card__title">예약접수</span>
                <span class="receipt-card__desc">예약 번호가 있는 경우</span>
              </a>
            </div>
            <a href="javascript:void(0);" class="btn btn--outline-dark btn--invoice">운송장 조회</a>
            <div class="deadline">
              <p class="deadline__title">택배 마감 시간</p>
              <p class="deadline__time">평일 15시 / 토요일 12시</p>
            </div>
        </section>
    </main>

  <script type="text/javascript" src="../../shared/js/localCommon.js" defer></script>
  </body>
</html>
