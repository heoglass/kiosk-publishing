<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, initial-scale=1.0">
    <title>편의점 택배</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="../../shared/css/LocalCommon.css" />
    <link rel="stylesheet" href="./percel.css" />
    <script type="text/javascript" src="./percel.js"></script>
  </head>
  <body id="parcelBody" data-page="indexMemberType">
    <main class="parcel-main kiosk-screen">
        <!-- 세로형 공통헤더 -->
        <header id="category-header-vertical" class="parcel__header">
            <div class="header-left">
              <a href="../../index.html" aria-label="처음으로">
                <img
                  src="../../shared/images/icon/icon-home.png"
                  alt=""
                  class="category-header-home"
                />
              </a>
              <img
                src="../../shared/images/icon/arrow-right-w.png"
                alt=""
                class="category-header-arrow-right"
              />

              <span id="header-title"></span>
            </div>
            <!-- <div class="header-right"> -->
            <button
              type="button"
              class="header-sound-toggle"
              aria-label="소리"
              aria-pressed="true"
              data-sound-off-src="../../shared/images/icon/sound_w_off.png"
            >
              <img src="../../shared/images/icon/sound_w.png" class="header-sound" alt="" />
            </button>
            <!-- </div> -->
        </header>

        <section class="parcel__content parcel__content--indexMemberType">
            <ol class="parcel-step" aria-label="진행 단계">
              <li class="parcel-step__item is-active" aria-current="step"><span class="blind">1단계</span></li>
              <li class="parcel-step__item"><span class="blind">2단계</span></li>
              <li class="parcel-step__item"><span class="blind">3단계</span></li>
              <li class="parcel-step__item"><span class="blind">4단계</span></li>
              <li class="parcel-step__item"><span class="blind">5단계</span></li>
              <li class="parcel-step__item"><span class="blind">6단계</span></li>
              <li class="parcel-step__item"><span class="blind">7단계</span></li>
              <li class="parcel-step__item"><span class="blind">8단계</span></li>
            </ol>
            <div class="parcel-title">
              <h2 class="parcel-title__main">편의점 택배 회원이세요?</h2>
            </div>
            <ul class="option-list">
              <li class="option-list__item">
                <a href="javascript:void(0);" class="option-card">
                   <!-- [수정] 2026-11-27 | 회원 타입 아이콘 적용 -->
                  <img src="../../shared/images/parcel/user_member.png" alt="회원" class="option-card__icon" />
                  <span class="option-card__text">
                    <strong class="option-card__title">회원</strong>
                    <span class="option-card__desc">편의점 택배 회원이에요.</span>
                  </span>
                </a>
              </li>
              <li class="option-list__item">
                <a href="./indexServiceType.html" class="option-card is-selected">
                  <img src="../../shared/images/parcel/user_single.png" alt="비회원" class="option-card__icon" />
                  <span class="option-card__text">
                    <strong class="option-card__title">비회원</strong>
                    <span class="option-card__desc">편의점 택배 회원이 아니에요</span>
                  </span>
                </a>
              </li>
            </ul>
        </section>

        <!-- 하단 이전 버튼 -->
        <footer class="parcel__footer d-none">
            <a href="./index.html" id="backBtn" class="parcel__back">
              <img src="../../shared/images/icon/arrow-left-w.png" alt="" class="parcel__back-icon" />
              <span>< 이전</span>
            </a>
        </footer>
    </main>

  <script type="text/javascript" src="../../shared/js/localCommon.js" defer></script>
  </body>
</html>
