<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>카페 주문 확인 화면</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="../../shared/css/common.css" />
    <link rel="stylesheet" href="./cafe.css" />
    <script
      type="text/javascript"
      src="../../shared/js/common.js"
      defer=""
    ></script>
    <script type="text/javascript" src="./cafe.js" defer=""></script>
  </head>
  <body>
    <header id="category-header">
      <div class="header-left">
        <button
          type="button"
          id="header-back"
          class="header-back"
          aria-label="이전 화면으로"
        >
          <img
            src="../../shared/images/icon/arrow-back.png"
            class="arrow-back"
            alt="뒤로가기 화살표"
          />
        </button>

        <span id="header-title"></span>
      </div>
      <div class="header-right">
        <img
          src="../../shared/images/icon/sound_w.png"
          class="header-sound"
          alt="소리 이미지"
        />
        <span class="header-sound-text">소리끄기</span>
      </div>
    </header>

    <main class="cafe-main category-main">
      <section
        id="screen-review"
        class="cafe-screen"
        aria-labelledby="review-title"
      >
        <!-- 본문 전체 스크롤 -->
        <div class="review-scroll">
          <h2 id="review-title">주문 내역을 확인해주세요.</h2>

          <!-- 퍼블리싱용 고정 주문 예시: 메뉴 페이지의 변경 내용과 연동하지 않습니다. -->
          <ul class="review-list">
            <li class="review-item">
              <div class="review-item-info">
                <span class="review-item-name">아이스 아메리카노</span>
              </div>

              <span class="review-item-quantity">1개</span>
              <span class="review-item-price">2,000원</span>
            </li>
            <li class="review-item">
              <div class="review-item-info">
                <span class="review-item-name">카페라떼</span>
              </div>

              <span class="review-item-quantity">1개</span>
              <span class="review-item-price">3,200원</span>
            </li>
          </ul>

          <div class="dividing-line"></div>

          <!-- 합계 -->
          <div class="review-summary">
            <dl class="review-totals">
              <div class="review-total-row">
                <dt>총 수량</dt>
                <dd class="review-total-count">2개</dd>
              </div>

              <div class="review-total-row">
                <dt>총 결제금액</dt>
                <dd class="review-total-price">5,200원</dd>
              </div>
            </dl>
          </div>

          <div class="dividing-line"></div>

          <!-- 추천 메뉴 -->
          <section class="recommend-section" aria-labelledby="recommend-title">
            <h3 id="recommend-title">함께 드시면 좋아요</h3>

            <ul class="recommend-list">
              <li class="recommend-item">
                <button type="button" class="recommend-button">
                  <img src="../../shared/images/cafe/bagle.png" alt="" />
                  <span class="recommend-name">어니언 베이글</span>
                  <span class="recommend-price">2,000원</span>
                </button>
              </li>
              <li class="recommend-item">
                <button type="button" class="recommend-button">
                  <img src="../../shared/images/cafe/muffin.png" alt="" />
                  <span class="recommend-name">햄치즈 머핀</span>
                  <span class="recommend-price">3,200원</span>
                </button>
              </li>
              <li class="recommend-item">
                <button type="button" class="recommend-button">
                  <img src="../../shared/images/cafe/toast.png" alt="" />
                  <span class="recommend-name">프렌치 토스트</span>
                  <span class="recommend-price">2,000원</span>
                </button>
              </li>
            </ul>
          </section>
        </div>

        <!-- 스크롤 영역 밖에 배치 -->
        <div class="review-bottom">
          <button type="button" class="review-back">돌아가기</button>

          <button type="button" class="review-dine-in">
            <span>먹고가기</span>
            <small>(다회용컵)</small>
          </button>

          <button type="button" class="review-takeout">
            <span>포장하기</span>
            <small>(일회용컵)</small>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
