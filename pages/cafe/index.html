<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>카페</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="../../shared/css/common.css" />
    <link rel="stylesheet" href="./cafe.css" />
    <script
      type="text/javascript"
      src="../../shared/js/common.js"
      defer
    ></script>
    <script type="text/javascript" src="./cafe.js" defer></script>
  </head>
  <body>
    <main class="cafe-main category-main kiosk-screen">
      <header id="category-header" class="cafe__header">
        <div class="header-left">
          <!-- <button
            type="button"
            id="header-back"
            class="header-back"
            aria-label="이전 화면으로"
          >
            <img
              src="../../shared/images/icon/arrow-back.png"
              class="arrow-back"
              alt="뒤로가기 화살표"
            />
          </button> -->
          <a href="../../index.html" aria-label="처음으로">
            <img
              src="../../shared/images/icon/icon-home.png"
              alt=""
              class="category-header-home"
            />
          </a>

          <img
            src="../../shared/images/icon/arrow-right-w.png"
            alt=""
            class="category-header-arrow-right"
          />

          <span id="header-title"></span>
        </div>
        <!-- <div class="header-right"> -->
        <button
          type="button"
          class="header-sound-toggle"
          aria-label="소리"
          aria-pressed="true"
          data-sound-off-src="../../shared/images/icon/sound_w_off.png"
        >
          <img
            src="../../shared/images/icon/sound_w.png"
            class="header-sound"
            alt=""
          />
        </button>
        <!-- </div> -->
      </header>
      <section
        id="category-start-screen"
        class="cafe-screen category-start-screen"
        aria-label="카페 주문 시작"
      >
        <button type="button" class="category-start">
          <!-- <img
            class="category-main-image"
            src="../../shared/images/cafe/cafe-visual.png"
            alt=""
          /> -->
          <div class="category-title-area cafe">
            <p class="category-title1">Cafe Kiosk</p>
            <p class="category-title2">Educational kiosk</p>
          </div>
          <div class="category-main-message">
            <span> 화면을 터치하시면 주문이 시작됩니다. </span>
          </div>
        </button>
      </section>
    </main>
  </body>
</html>
