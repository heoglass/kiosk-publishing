<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>병원진료 발급기</title>
    <link rel="stylesheet" href="../../shared/css/common.css" />
    <link rel="stylesheet" href="./hospital.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
    <script src="../../shared/js/common.js" defer></script>
    <script src="./hospital.js" defer></script>
  </head>
  <body>
    <main class="hospital-main category-main kiosk-screen">
      <header id="category-header" class="hospital__header">
        <div class="header-left">
          <a href="../../index.html" aria-label="처음으로">
            <img
              src="../../shared/images/icon/icon-home.png"
              alt=""
              class="category-header-home"
            />
          </a>

          <img
            src="../../shared/images/icon/arrow-right-w.png"
            alt=""
            class="category-header-arrow-right"
          />

          <span id="header-title">병원진료 발급기</span>
        </div>

        <button
          type="button"
          class="header-sound-toggle"
          aria-label="소리"
          aria-pressed="true"
          data-sound-off-src="../../shared/images/icon/sound_w_off.png"
        >
          <img
            src="../../shared/images/icon/sound_w.png"
            class="header-sound"
            alt=""
          />
        </button>
      </header>
      <div class="hospital-top-container">
        <p class="hospital-top-title">00대학병원</p>
        <a href="./index.html" class="hospital-top-gohome">처음 화면</a>
      </div>
      <section
        class="hospital-screen hospital-issue-screen hospital-complete-screen"
        aria-labelledby="hospital-complete-title"
      >
        <div class="hospital-complete-top">
          <h1 id="hospital-issue-title" class="hospital-entry-title">
            증명서 발급이 완료되었습니다
          </h1>
          <p class="hospital-issue-guide">
            휴대전화, 지갑 등 귀중품을 <br />
            두고가는 일이 없도록 주의해 주세요
          </p>

          <div class="hospital-complete-image" aria-hidden="true">
            <img
              src="../../shared/images/hospital/hospital-complete.png"
              alt=""
            />
          </div>
        </div>
        <div class="hospital-complete-bottom">
          <a class="hospital-complete-button" href="./hospital_06.html">확인</a>
        </div>
      </section>
    </main>
  </body>
</html>
