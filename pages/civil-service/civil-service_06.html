<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>민원서류발급</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="../../shared/css/common.css" />
    <link rel="stylesheet" href="./civil-service.css" />
    <link rel="stylesheet" href="./civil-service.css" />
    <script src="../../shared/js/common.js" defer></script>
    <script src="./civil-service.js" defer></script>
  </head>
  <body class="civil-service-page">
    <main class="civil-service-main category-main kiosk-screen">
      <header id="category-header" class="civil-service__header">
        <div class="header-left">
          <a href="../../index.html" aria-label="처음으로">
            <img
              src="../../shared/images/icon/icon-home-b.png"
              alt=""
              class="category-header-home"
            />
          </a>

          <img
            src="../../shared/images/icon/arrow-right-b.png"
            alt=""
            class="category-header-arrow-right"
          />

          <span id="header-title"></span>
        </div>

        <button
          type="button"
          class="header-sound-toggle"
          aria-label="소리"
          aria-pressed="true"
          data-sound-off-src="../../shared/images/icon/sound_b_off.png"
        >
          <img
            src="../../shared/images/icon/sound_b.png"
            class="header-sound"
            alt=""
          />
        </button>
      </header>

      <div class="civil-service-flex-container">
        <section
          class="civil-service-screen service-print-screen"
          aria-labelledby="service-title"
        >
          <h1 class="service-title" id="service-title">발급부수 선택</h1>
          <p class="service-description">
            발급할 부수를 선택하고 [확인]을 눌러주세요
          </p>

          <output
            class="service-copy-display"
            id="service-copy-display"
            aria-label="발급 부수"
            >1</output
          >
          <p class="service-print-note">최대 9부까지 선택 가능합니다</p>

          <div
            class="service-copy-keypad"
            id="service-copy-keypad"
            role="group"
            aria-label="발급 부수 선택"
          >
            <button type="button" data-service-copy="1" aria-pressed="true">
              1
            </button>
            <button type="button" data-service-copy="2" aria-pressed="false">
              2
            </button>
            <button type="button" data-service-copy="3" aria-pressed="false">
              3
            </button>
            <button type="button" data-service-copy="4" aria-pressed="false">
              4
            </button>
            <button type="button" data-service-copy="5" aria-pressed="false">
              5
            </button>
            <button type="button" data-service-copy="6" aria-pressed="false">
              6
            </button>
            <button type="button" data-service-copy="7" aria-pressed="false">
              7
            </button>
            <button type="button" data-service-copy="8" aria-pressed="false">
              8
            </button>
            <button type="button" data-service-copy="9" aria-pressed="false">
              9
            </button>
          </div>
        </section>

        <div class="service-auth-bottom">
          <div class="service-auth-actions">
            <a
              href="./civil-service_05.html"
              class="service-auth-back"
              data-service-link
              >이전</a
            >
            <button
              type="button"
              class="service-auth-confirm"
              id="service-copy-confirm"
            >
              확인
            </button>
          </div>
          <!-- [추가] 2026-11-27 | 처음으로 버튼 추가 -->
          <footer class="civil-service-footer">
            <p class="footer-left-text">현금 가능 | 카드가능</p>
            <div class="footer-right">
              <a href="./index.html" class="go-service-home">처음으로</a>
              <div class="wheelchair">
                <img
                  src="../../shared/images/icon/icon-wheelchair.png"
                  alt=""
                  class="wheelchair-image"
                />
                <p class="wheelchair-text">휠체어 사용자 보기</p>
              </div>
            </div>
          </footer>
        </div>
      </div>
    </main>
  </body>
</html>
