  <body class="civil-service-page">
    <main class="civil-service-main category-main kiosk-screen">
      <header id="category-header" class="civil-service__header">
        <div class="header-left">
          <a href="../../index.html" aria-label="처음으로">
            <img
              src="../../shared/images/icon/icon-home-b.png"
              alt=""
              class="category-header-home"
            />
          </a>

          <img
            src="../../shared/images/icon/arrow-right-b.png"
            alt=""
            class="category-header-arrow-right"
          />

          <span id="header-title"></span>
        </div>

        <button
          type="button"
          class="header-sound-toggle"
          aria-label="소리"
          aria-pressed="true"
          data-sound-off-src="../../shared/images/icon/sound_b_off.png"
        >
          <img
            src="../../shared/images/icon/sound_b.png"
            class="header-sound"
            alt=""
          />
        </button>
      </header>

      <div class="civil-service-flex-container">
        <section
          class="civil-service-screen service-fingerprint-screen"
          aria-labelledby="service-title"
        >
          <p id="service-title" class="service-fingerprint-title">
            지문인식기에<br />
            <span>오른손 엄지 손가락</span>을 올려주세요
          </p>
          ㅋㅋㅋㅋㅋ
          <p class="service-fingerprint-guide">
            오른쪽 엄지 손가락을 위로 올려서 인식해주세요
          </p>
          <button
            type="button"
            class="service-fingerprint-reader"
            id="service-fingerprint-reader"
            aria-label="지문 인식 시작"
            data-loading-next="./civil-service_05.html"
          >
            <div id="fingerprint-thumb"></div>
          </button>
        </section>

        id="service-loading"

        <div class="service-loading-content">
          <div id="lottie-fingerprint" class="lottie-fingerprint"></div>
          <p id="service-loading-title">
            지문 인식중입니다.<br />손을 떼지마세요
