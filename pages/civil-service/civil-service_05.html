<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>민원서류발급</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="../../shared/css/common.css" />
    <link rel="stylesheet" href="./civil-service.css" />
    <script src="../../shared/js/common.js" defer></script>
    <script src="./civil-service.js" defer></script>
  </head>
  <body class="civil-service-page">
    <main class="civil-service-main category-main kiosk-screen">
      <header id="category-header" class="civil-service__header">
        <div class="header-left">
          <!-- <button
            type="button"
            id="header-back"
            class="header-back"
            aria-label="이전 화면으로"
          >
            <img
              src="../../shared/images/icon/arrow-back.png"
              class="arrow-back"
              alt="뒤로가기 화살표"
            />
          </button> -->
          <a href="../../index.html" aria-label="처음으로">
            <img
              src="../../shared/images/icon/icon-home-b.png"
              alt=""
              class="category-header-home"
            />
          </a>

          <img
            src="../../shared/images/icon/arrow-right-b.png"
            alt=""
            class="category-header-arrow-right"
          />

          <span id="header-title"></span>
        </div>
        <!-- <div class="header-right"> -->
        <button
          type="button"
          class="header-sound-toggle"
          aria-label="소리"
          aria-pressed="true"
          data-sound-off-src="../../shared/images/icon/sound_b_off.png"
        >
          <img
            src="../../shared/images/icon/sound_b.png"
            class="header-sound"
            alt=""
          />
        </button>
        <!-- </div> -->
      </header>
      <div class="civil-service-flex-container">
        <section
          class="civil-service-screen service-issuance-screen"
          aria-labelledby="service-title"
        >
          <h1 class="service-title" id="service-title">주민등록표(등본)</h1>
          <p class="service-description">
            개인정보 보호를 위해 아래의 등본 사항 중<br />
            필요 사항 선택 후 [확인]을 눌러주세요
          </p>

          <div class="service-issuance-panel" id="service-issuance-options">
            <div class="service-issuance-tools">
              <div
                class="service-issuance-group"
                role="group"
                aria-label="발급 용도"
              >
                <label class="service-issuance-choice service-issuance-use">
                  <input
                    type="radio"
                    name="issuance-use"
                    value="court"
                    checked
                  />
                  <span>법원</span>
                </label>
                <label class="service-issuance-choice service-issuance-use">
                  <input type="radio" name="issuance-use" value="finance" />
                  <span>금융</span>
                </label>
              </div>

              <div
                class="service-issuance-group"
                role="group"
                aria-label="등본 항목 일괄 선택"
              >
                <label class="service-issuance-choice">
                  <input type="radio" name="issuance-bulk" value="include" />
                  <span>전체 포함</span>
                </label>
                <label class="service-issuance-choice">
                  <input type="radio" name="issuance-bulk" value="exclude" />
                  <span>미포함</span>
                </label>
              </div>
            </div>

            <ol class="service-issuance-rows" aria-label="등본 발급 항목">
              <li class="service-issuance-row">
                <p
                  class="service-issuance-row-title"
                  id="issuance-item-1-title"
                >
                  1. 과거의 주소 변동 사항
                </p>
                <div
                  class="service-issuance-group"
                  role="group"
                  aria-labelledby="issuance-item-1-title"
                >
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-1"
                      value="include"
                      data-issuance-choice="include"
                    />
                    <span>포함</span>
                  </label>
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-1"
                      value="exclude"
                      data-issuance-choice="exclude"
                    />
                    <span>미포함</span>
                  </label>
                </div>
              </li>
              <li class="service-issuance-row">
                <p
                  class="service-issuance-row-title"
                  id="issuance-item-2-title"
                >
                  2. 세대 구성 사유
                </p>
                <div
                  class="service-issuance-group"
                  role="group"
                  aria-labelledby="issuance-item-2-title"
                >
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-2"
                      value="include"
                      data-issuance-choice="include"
                    />
                    <span>포함</span>
                  </label>
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-2"
                      value="exclude"
                      data-issuance-choice="exclude"
                    />
                    <span>미포함</span>
                  </label>
                </div>
              </li>
              <li class="service-issuance-row">
                <p
                  class="service-issuance-row-title"
                  id="issuance-item-3-title"
                >
                  3. 세대 구성일자
                </p>
                <div
                  class="service-issuance-group"
                  role="group"
                  aria-labelledby="issuance-item-3-title"
                >
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-3"
                      value="include"
                      data-issuance-choice="include"
                    />
                    <span>포함</span>
                  </label>
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-3"
                      value="exclude"
                      data-issuance-choice="exclude"
                    />
                    <span>미포함</span>
                  </label>
                </div>
              </li>
              <li class="service-issuance-row">
                <p
                  class="service-issuance-row-title"
                  id="issuance-item-4-title"
                >
                  4. 발생일 / 신고일
                </p>
                <div
                  class="service-issuance-group"
                  role="group"
                  aria-labelledby="issuance-item-4-title"
                >
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-4"
                      value="include"
                      data-issuance-choice="include"
                    />
                    <span>포함</span>
                  </label>
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-4"
                      value="exclude"
                      data-issuance-choice="exclude"
                    />
                    <span>미포함</span>
                  </label>
                </div>
              </li>
              <li class="service-issuance-row">
                <p
                  class="service-issuance-row-title"
                  id="issuance-item-5-title"
                >
                  5. 변동 사유
                </p>
                <div
                  class="service-issuance-group"
                  role="group"
                  aria-labelledby="issuance-item-5-title"
                >
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-5"
                      value="include"
                      data-issuance-choice="include"
                    />
                    <span>포함</span>
                  </label>
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-5"
                      value="exclude"
                      data-issuance-choice="exclude"
                    />
                    <span>미포함</span>
                  </label>
                </div>
              </li>
              <li class="service-issuance-row">
                <p
                  class="service-issuance-row-title"
                  id="issuance-item-6-title"
                >
                  6. 교부 대상자 외 세대주·세대원·외국인 등의 이름
                </p>
                <div
                  class="service-issuance-group"
                  role="group"
                  aria-labelledby="issuance-item-6-title"
                >
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-6"
                      value="include"
                      data-issuance-choice="include"
                    />
                    <span>포함</span>
                  </label>
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-6"
                      value="exclude"
                      data-issuance-choice="exclude"
                    />
                    <span>미포함</span>
                  </label>
                </div>
              </li>
              <li class="service-issuance-row">
                <p
                  class="service-issuance-row-title"
                  id="issuance-item-7-title"
                >
                  7. 주민등록번호 뒷자리
                </p>
                <div
                  class="service-issuance-group"
                  role="group"
                  aria-labelledby="issuance-item-7-title"
                >
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-7"
                      value="all"
                      data-issuance-choice="include"
                    />
                    <span>세대전부</span>
                  </label>
                  <label class="service-issuance-choice">
                    <input type="radio" name="issuance-item-7" value="some" />
                    <span>세대일부</span>
                  </label>
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-7"
                      value="exclude"
                      data-issuance-choice="exclude"
                    />
                    <span>미포함</span>
                  </label>
                </div>
              </li>
              <li class="service-issuance-row">
                <p
                  class="service-issuance-row-title"
                  id="issuance-item-8-title"
                >
                  8. 세대원의 세대주와의 관계
                </p>
                <div
                  class="service-issuance-group"
                  role="group"
                  aria-labelledby="issuance-item-8-title"
                >
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-8"
                      value="general"
                      data-issuance-choice="include"
                    />
                    <span>일반</span>
                  </label>
                  <label class="service-issuance-choice">
                    <input type="radio" name="issuance-item-8" value="detail" />
                    <span>상세</span>
                  </label>
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-8"
                      value="exclude"
                      data-issuance-choice="exclude"
                    />
                    <span>미포함</span>
                  </label>
                </div>
              </li>
              <li class="service-issuance-row">
                <p
                  class="service-issuance-row-title"
                  id="issuance-item-9-title"
                >
                  9. 동거인
                </p>
                <div
                  class="service-issuance-group"
                  role="group"
                  aria-labelledby="issuance-item-9-title"
                >
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-9"
                      value="include"
                      data-issuance-choice="include"
                    />
                    <span>포함</span>
                  </label>
                  <label class="service-issuance-choice">
                    <input
                      type="radio"
                      name="issuance-item-9"
                      value="exclude"
                      data-issuance-choice="exclude"
                    />
                    <span>미포함</span>
                  </label>
                </div>
              </li>
            </ol>
          </div>
        </section>

        <div class="service-auth-bottom">
          <div class="service-auth-actions">
            <a
              href="./civil-service_04.html"
              class="service-auth-back"
              data-service-link
              >이전</a
            >
            <button
              type="button"
              class="service-auth-confirm"
              id="service-issuance-confirm"
            >
              확인
            </button>
          </div>
          <footer class="civil-service-footer">
            <p class="footer-left-text">현금 가능 | 카드가능</p>
            <div class="footer-right">
              <img
                src="../../shared/images/icon/icon-wheelchair.png"
                alt=""
                class="wheelchair"
              />
              <p class="wheelchair-text">휠체어 사용자 보기</p>
            </div>
          </footer>
        </div>
      </div>

      <dialog
        class="service-loading"
        id="service-issuance-warning"
        role="alertdialog"
        aria-labelledby="service-issuance-warning-message"
      >
        <form class="service-issuance-alert-content" method="dialog">
          <p id="service-issuance-warning-message"></p>
          <button type="submit" class="service-issuance-alert-button" autofocus>
            확인
          </button>
        </form>
      </dialog>

      <dialog
        class="service-loading"
        id="service-loading"
        aria-labelledby="service-loading-title"
      >
        <div class="service-loading-content">
          <span class="service-spinner" aria-hidden="true"></span>
          <p id="service-loading-title">자료 수신 중입니다.</p>
        </div>
      </dialog>
    </main>
  </body>
</html>
