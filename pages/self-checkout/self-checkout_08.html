<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>체험 완료</title>
    <link rel="stylesheet" href="../../shared/css/common.css" />
    <link rel="stylesheet" href="./self-checkout.css" />
    <link rel="stylesheet" href="../../shared/css/complete.css" />
    <script src="../../shared/js/common.js" defer></script>
    <script src="./self-checkout.js" defer></script>
  </head>
  <body>
    <div class="kiosk-screen complete-screen">
      <header id="category-header" class="self-checkout__header">
        <div class="header-left">
          <!-- <button
            type="button"
            id="header-back"
            class="header-back"
            aria-label="이전 화면으로"
          >
            <img
              src="../../shared/images/icon/arrow-back.png"
              class="arrow-back"
              alt="뒤로가기 화살표"
            />
          </button> -->
          <a href="../../index.html" aria-label="처음으로">
            <img
              src="../../shared/images/icon/icon-home-b.png"
              alt=""
              class="category-header-home"
            />
          </a>

          <img
            src="../../shared/images/icon/arrow-right-b.png"
            alt=""
            class="category-header-arrow-right"
          />

          <span id="header-title"></span>
        </div>
        <!-- <div class="header-right"> -->
        <button
          type="button"
          class="header-sound-toggle"
          aria-label="소리"
          aria-pressed="true"
          data-sound-off-src="../../shared/images/icon/sound_b_off.png"
        >
          <img
            src="../../shared/images/icon/sound_b.png"
            class="header-sound"
            alt=""
          />
        </button>
        <!-- </div> -->
      </header>
      <main class="complete-main experience-complete">
        <div class="complete-main-contents">
          <div class="complete-text-area">
            <h1 class="complete-title">체험 완료</h1>
            <p class="complete-message">
              키오스크 체험이 완료되었습니다.<br />수고하셨습니다.
            </p>
          </div>
          <img
            src="../../shared/images/experience-complete-yellow.png"
            class="complete-experience-image"
            alt="키오스크 체험 완료"
          />
        </div>
        <div class="complete-actions" aria-label="체험 완료 후 이동">
          <a
            type="button"
            id="experience-retry"
            class="complete-button complete-button-secondary self-checkout"
            href="./index.html"
          >
            다시하기
          </a>
          <a class="self-checkout-first-btn" href="../../index.html"
            >첫 화면으로 가기</a
          >
        </div>
      </main>
    </div>
  </body>
</html>
