<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>푸드코트 - 03주문내역 확인</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="../../shared/css/common.css" />
    <link rel="stylesheet" href="./food-court.css" />
    <script type="text/javascript" src="../../shared/js/common.js"></script>
    <script type="text/javascript" src="./food-court.js"></script>
    <!-- CDN링크 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
  </head>

  <body id="index-orderlist">
    <div class="foodcourt-container foodcourt-dimed">
      <main class="foodcourt category-main">
        <header id="category-header" class="foodcourt__header">
          <div class="header-left">
            <!-- <button
            type="button"
            id="header-back"
            class="header-back"
            aria-label="이전 화면으로"
          >
            <img
              src="../../shared/images/icon/arrow-back.png"
              class="arrow-back"
              alt="뒤로가기 화살표"
            />
          </button> -->
            <a href="../../index.html" aria-label="처음으로">
              <img
                src="../../shared/images/icon/icon-home.png"
                alt=""
                class="category-header-home"
              />
            </a>

            <img
              src="../../shared/images/icon/arrow-right-w.png"
              alt=""
              class="category-header-arrow-right"
            />

            <span id="header-title"></span>
          </div>
          <!-- <div class="header-right"> -->
          <button
            type="button"
            class="header-sound-toggle"
            aria-label="소리"
            aria-pressed="true"
            data-sound-off-src="../../shared/images/icon/sound_w_off.png"
          >
            <img
              src="../../shared/images/icon/sound_w.png"
              class="header-sound"
              alt=""
            />
          </button>
          <!-- </div> -->
        </header>
        <section class="foodcourt__section orderlist__view">
          <h2 class="section-title order__list-title">
            주문 내역을 확인해주세요
          </h2>

          <!-- 주문 상품 목록 -->
          <div class="order-list-wrap">
            <!-- 상품 1 -->
            <div class="order-item">
              <span class="order-item__name">능동 미나리 곰탕</span>
              <div class="order-count__wrap">
                <span class="order-item__count">1개</span>
                <span class="order-item__price">15,000원</span>
              </div>
            </div>

            <!-- 상품 2 (옵션 포함) -->
            <div class="order-item">
              <span class="order-item__name">전주비빔밥</span>
              <div class="order-count__wrap">
                <span class="order-item__count">2개</span>
                <span class="order-item__price">24,000원</span>
              </div>
            </div>
            <!-- 옵션이 있는 경우 -->
            <div class="order-item__option">
              <span>옵션: 소스 따로 주세요</span>
            </div>
          </div>

          <span class="divider"></span>

          <!-- 주문 총괄 요약 영역 -->
          <div class="order-summary-wrap">
            <!-- 총 수량 -->
            <div class="order-summary-item">
              <span class="order-summary-item__name">총 수량</span>
              <span class="order-summary-item__value">2개</span>
            </div>

            <!-- 총 결제금액 -->
            <div class="order-summary-item order-summary-item--total">
              <span class="order-summary-item__name">총 결제금액</span>
              <span
                class="order-summary-item__value order-summary-item__value--price"
                >39,000원</span
              >
            </div>
          </div>

          <span class="divider"></span>
        </section>

        <!-- 하단 버튼 -->
        <section class="order-bar foodcourt__oderbar" aria-label="주문 관리">
          <button type="button" class="btn-action order__btn--back">
            돌아가기
          </button>
          <button type="button" class="btn-action btn-dine-in">
            먹고가기 <span class="sub-text">(다회용컵)</span>
          </button>
          <button type="button" class="btn-action btn-takeout">
            포장하기 <span class="sub-text">(일회용컵)</span>
          </button>
        </section>
      </main>
    </div>

    <!-- 결제수단 선택 팝업 -->

    <div
      id="modal-card-payment"
      class="modal modal--payment"
      aria-labelledby="modal-payment-title"
    >
      <div class="modal-header">
        <h2 id="modal-card-payment-title" class="modal-title-step">
          카드 결제
        </h2>

        <button
          type="button"
          class="modal-close"
          data-modal-close
          aria-label="닫기"
        >
          <img
            src="../../shared/images/icon/close_w.png"
            class="modal-close-image"
            alt=""
            aria-hidden="true"
          />
          <!--  -->
        </button>
      </div>
      <button
        type="button"
        class="payment-image-button"
        data-card-inserted
        aria-label="카드 삽입"
      >
        <img
          class="card-payment-image card-insert"
          src="../../shared/images/icon/icon-insert-card.png"
          alt=""
        />
      </button>

      <div class="modal-body">
        <p class="card-payment-guide">카드를 투입구에 넣어주세요.</p>

        <p class="card-payment-description">
          삼성/애플페이로 결제시 결제화면을 실행 후<br />
          <strong>휴대폰을 투입구 가까이</strong>에 갖다대세요.
        </p>

        <dl class="card-payment-summary">
          <div class="card-payment-summary-row">
            <dt>총 수량</dt>
            <dd class="card-payment-count">0개</dd>
          </div>

          <div class="card-payment-summary-row">
            <dt>총 결제금액</dt>
            <dd class="card-payment-total">0원</dd>
          </div>
        </dl>
      </div>
    </div>

    <!-- CDN -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  </body>
</html>
