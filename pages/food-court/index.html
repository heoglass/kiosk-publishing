<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>푸드코트</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="../../shared/css/common.css" />
  <link rel="stylesheet" href="./food-court.css" />
  <script type="text/javascript" src="../../shared/js/common.js"></script>
  <script type="text/javascript" src="./food-court.js"></script>
  <!-- CDN링크 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

</head>

<body>
  <div class="foodcourt-container">
    <header id="category-header" class="foodcourt__header">
      <div class="header-left">
        <button type="button" id="header-back" class="header-back" aria-label="이전 화면으로">
          <img src="../../shared/images/icon/arrow-back.png" class="arrow-back" alt="뒤로가기 화살표" />
        </button>

        <span id="header-title"></span>
      </div>
      <div class="header-right">
        <img src="../../shared/images/icon/sound_w.png" class="header-sound" alt="" />
        <p class="header-sound-text main-sound-text">소리끄기</p>
      </div>
    </header>
    <main class="foodcourt category-main">
      <section class="foodcourt__section">
        <!-- 상단 카테고리 NAV 탭 -->
        <nav class="foodcourt__nav">
          <ul class="menu-list">
            <li class="menu-item">
              <button type="button" class="nav__tab nav__tab--active">
                <span>한식</span>
              </button>
            </li>
            <li class="menu-item">
              <button type="button" class="nav__tab">
                <span>양식</span>
              </button>
            </li>
            <li class="menu-item">
              <button type="button" class="nav__tab">
                <span>중식</span>
              </button>
            </li>
            <li class="menu-item">
              <button type="button" class="nav__tab">
                <span>일식</span>
              </button>
            </li>
          </ul>
        </nav>

        <!-- 탭 컨텐츠 영역 -->
        <div class="foodcourt__contents">

          <!-- 1. 한식 탭 컨텐츠 -->
          <div class="foodcourt__content foodcourt__content--active">
            <div class="swiper product-swiper">
              <div class="swiper-wrapper">
                <!-- 페이지 1 (메뉴 6개) -->
                <div class="swiper-slide">
                  <ul class="product-grid">
                    <li class="product-card">
                      <div class="product-card__thumb">
                        <img src="/shared/images/foodcourt/menu_1.png" alt="능동 미나리 곰탕" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">능동 미나리 곰탕</span>
                        <span class="product-card__price">10,000원</span>
                      </div>
                    </li>

                    <li class="product-card">
                      <div class="product-card__thumb">
                        <img src="/shared/images/foodcourt/menu_2.png" alt="회냉면" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">회냉면</span>
                        <span class="product-card__price">10,000원</span>
                      </div>
                    </li>

                    <li class="product-card">
                      <div class="product-card__thumb">
                        <img src="/shared/images/foodcourt/menu_3.png" alt="전주비빔밥" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">전주비빔밥</span>
                        <span class="product-card__price">10,000원</span>
                      </div>
                    </li>

                    <li class="product-card">
                      <div class="product-card__thumb">
                        <img src="/shared/images/foodcourt/menu_4.png" alt="육회비빔밥" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">육회비빔밥</span>
                        <span class="product-card__price">10,000원</span>
                      </div>
                    </li>

                    <li class="product-card">
                      <div class="product-card__thumb">
                        <img src="/shared/images/foodcourt/menu_5.png" alt="짜장면+탕수육" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">짜장면+탕수육</span>
                        <span class="product-card__price">10,000원</span>
                      </div>
                    </li>

                    <li class="product-card">
                      <div class="product-card__thumb">
                        <img src="/shared/images/foodcourt/menu_6.png" alt="까르보나라" class="product-card__img" />
                      </div>
                      <div class="product-card__info">
                        <span class="product-card__title">까르보나라</span>
                        <span class="product-card__price">10,000원</span>
                      </div>
                    </li>
                  </ul>
                </div>
                <!-- 페이지 2 (6개 초과 시 다음 슬라이드로) -->
                <div class="swiper-slide">
                  <ul class="product-grid">
                    <li class="product-card">한식 메뉴 7</li>
                    <li class="product-card">한식 메뉴 8</li>
                  </ul>
                </div>
              </div>

              <!-- 하단 슬라이드 이전/다음 버튼 (해당 탭 전용) -->
              <div class="slider-controls">
                <button type="button" class="slider-controls__btn slider-controls__btn--prev">이전</button>
                <div class="swiper-pagination"></div>
                <button type="button" class="slider-controls__btn slider-controls__btn--next">다음</button>
              </div>
            </div>
          </div>

          <!-- 2. 양식 탭 컨텐츠 -->
          <div class="foodcourt__content">
            <div class="swiper product-swiper">
              <div class="swiper-wrapper">
                <div class="swiper-slide">
                  <ul class="product-grid">
                    <li class="product-card">양식 메뉴 1</li>
                    <li class="product-card">양식 메뉴 2</li>
                    <li class="product-card">양식 메뉴 3</li>
                    <li class="product-card">양식 메뉴 4</li>
                    <li class="product-card">양식 메뉴 5</li>
                    <li class="product-card">양식 메뉴 6</li>
                  </ul>
                </div>
                <div class="swiper-slide">
                  <ul class="product-grid">
                    <li class="product-card">양식 메뉴 7</li>
                  </ul>
                </div>
              </div>

              <div class="slider-controls">
                <button type="button" class="slider-controls__btn slider-controls__btn--prev">이전</button>
                <div class="swiper-pagination"></div>
                <button type="button" class="slider-controls__btn slider-controls__btn--next">다음</button>
              </div>
            </div>
          </div>

          <!-- 3. 중식 탭 컨텐츠 -->
          <div class="foodcourt__content">
            <div class="swiper product-swiper">
              <div class="swiper-wrapper">
                <div class="swiper-slide">
                  <ul class="product-grid">
                    <li class="product-card">중식 메뉴 1</li>
                    <li class="product-card">중식 메뉴 2</li>
                  </ul>
                </div>
              </div>
              <div class="slider-controls">
                <button type="button" class="slider-controls__btn slider-controls__btn--prev">이전</button>
                <div class="swiper-pagination"></div>
                <button type="button" class="slider-controls__btn slider-controls__btn--next">다음</button>
              </div>
            </div>
          </div>

          <!-- 4. 일식 탭 컨텐츠 -->
          <div class="foodcourt__content">
            <div class="swiper product-swiper">
              <div class="swiper-wrapper">
                <div class="swiper-slide">
                  <ul class="product-grid">
                    <li class="product-card">일식 메뉴 1</li>
                  </ul>
                </div>
              </div>
              <div class="slider-controls">
                <button type="button" class="slider-controls__btn slider-controls__btn--prev">이전</button>
                <div class="swiper-pagination"></div>
                <button type="button" class="slider-controls__btn slider-controls__btn--next">다음</button>
              </div>
            </div>
          </div>

        </div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</body>

</html>
