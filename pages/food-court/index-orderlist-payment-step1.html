<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>푸드코트 - 03주문내역 확인</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="../../shared/css/common.css" />
  <link rel="stylesheet" href="./food-court.css" />
  <script type="text/javascript" src="../../shared/js/common.js"></script>
  <script type="text/javascript" src="./food-court.js"></script>
  <!-- CDN링크 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

</head>

<body id="index-orderlist">
  <div class="foodcourt-container foodcourt-dimed">
    <header id="category-header" class="foodcourt__header">
      <div class="header-left">
        <button type="button" id="header-back" class="header-back" aria-label="이전 화면으로">
          <img src="../../shared/images/icon/arrow-back.png" class="arrow-back" alt="뒤로가기 화살표" />
        </button>

        <span id="header-title"></span>
      </div>
      <div class="header-right">
        <img src="../../shared/images/icon/sound_w.png" class="header-sound" alt="" />
        <p class="header-sound-text main-sound-text">소리끄기</p>
      </div>
    </header>
    <main class="foodcourt category-main">
      <section class="foodcourt__section orderlist__view">

        <h2 class="section-title order__list-title">주문 내역을 확인해주세요</h2>

        <!-- 주문 상품 목록 -->
        <div class="order-list-wrap">
          <!-- 상품 1 -->
          <div class="order-item">
            <span class="order-item__name">능동 미나리 곰탕</span>
            <div class="order-count__wrap">
              <span class="order-item__count">1개</span>
              <span class="order-item__price">15,000원</span>
            </div>
          </div>

          <!-- 상품 2 (옵션 포함) -->
          <div class="order-item">
            <span class="order-item__name">전주비빔밥</span>
            <div class="order-count__wrap">
              <span class="order-item__count">2개</span>
              <span class="order-item__price">24,000원</span>
            </div>
          </div>
          <!-- 옵션이 있는 경우 -->
          <div class="order-item__option">
            <span>옵션: 소스 따로 주세요</span>
          </div>
        </div>

        <span class="divider"></span>

        <!-- 주문 총괄 요약 영역 -->
        <div class="order-summary-wrap">
          <!-- 총 수량 -->
          <div class="order-summary-item">
            <span class="order-summary-item__name">총 수량</span>
            <span class="order-summary-item__value">2개</span>
          </div>

          <!-- 총 결제금액 -->
          <div class="order-summary-item order-summary-item--total">
            <span class="order-summary-item__name">총 결제금액</span>
            <span class="order-summary-item__value order-summary-item__value--price">39,000원</span>
          </div>
        </div>

        <span class="divider"></span>
      </section>

      <!-- 하단 버튼 -->
      <section class="order-bar foodcourt__oderbar" aria-label="주문 관리">
        <button type="button" class="btn-action order__btn--back">돌아가기</button>
        <button type="button" class="btn-action btn-dine-in">
          먹고가기 <span class="sub-text">(다회용컵)</span>
        </button>
        <button type="button" class="btn-action btn-takeout">
          포장하기 <span class="sub-text">(일회용컵)</span>
        </button>

      </section>

    </main>
  </div>


  <!-- 결제수단 선택 팝업 -->

  <div id="modal-payment" class="modal modal--payment" aria-labelledby="modal-payment-title">
    <div class="modal-header">
      <h2 id="modal-payment-title" class="modal-title">결제수단 선택</h2>

      <button type="button" class="modal-close" data-modal-close aria-label="닫기">
        <img src="../../shared/images/icon/close_w.png" class="modal-close-image" alt="" aria-hidden="true" />
        <span>닫기</span>
      </button>
    </div>

    <div class="modal-body">
      <!-- 주요 결제수단 -->
      <div class="payment-main">
        <button type="button" class="payment-method" data-payment-method="card">
          <img src="../../shared/images/icon/icon-card.png" class="payment-icon" aria-hidden="true" alt="" />
          <span class="payment-name">카드결제</span>
          <span class="payment-description">(삼성/애플페이)</span>
        </button>

        <button type="button" class="payment-method" data-payment-method="app-card">
          <img src="../../shared/images/icon/icon-app-card.png" class="payment-icon" aria-hidden="true" alt="" />
          <span class="payment-name">앱카드</span>
          <span class="payment-description">(QR/바코드)</span>
        </button>
      </div>

      <!-- 간편결제 / 쿠폰 -->
      <div class="payment-sub">
        <button type="button" class="payment-method" data-payment-method="kakao-pay">
          <img src="../../shared/images/icon/icon-kakao-pay.png" class="payment-logo payment-logo--kakao"
            aria-hidden="true" />
          <span class="payment-name">카카오페이</span>
        </button>

        <button type="button" class="payment-method" data-payment-method="naver-pay">
          <img src="../../shared/images/icon/icon-n-pay.png" class="payment-logo payment-logo--naver"
            aria-hidden="true" />
          <span class="payment-name">네이버페이</span>
        </button>

        <button type="button" class="payment-method" data-payment-method="payco">
          <img src="../../shared/images/icon/icon-payco.png" class="payment-logo payment-logo--payco"
            aria-hidden="true" />
          <span class="payment-name">페이코</span>
        </button>

        <button type="button" class="payment-method" data-payment-method="zero-pay">
          <img src="../../shared/images/icon/icon-zero-pay.png" class="payment-logo payment-logo--zero"
            aria-hidden="true" />
          <span class="payment-name">제로페이</span>
        </button>

        <button type="button" class="payment-method" data-payment-method="wechat-pay">
          <img src="../../shared/images/icon/icon-wechat-pay.png" class="payment-logo payment-logo--wechat"
            aria-hidden="true" />
          <span class="payment-name">위챗페이</span>
        </button>

        <button type="button" class="payment-method" data-payment-method="danggeun-pay">
          <img src="../../shared/images/icon/icon-d-pay.png" class="payment-logo payment-logo--danggeun"
            aria-hidden="true" />
          <span class="payment-name">당근페이</span>
        </button>
      </div>
    </div>
  </div>


  <!-- CDN -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</body>

</html>
