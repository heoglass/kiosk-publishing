<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>푸드코트 - 03주문내역 확인</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="../../shared/css/common.css" />
    <link rel="stylesheet" href="./food-court.css" />
    <script type="text/javascript" src="../../shared/js/common.js"></script>
    <script type="text/javascript" src="./food-court.js"></script>
    <!-- CDN링크 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  </head>

  <body id="index-orderlist">
    <div class="foodcourt-container foodcourt-dimed">
      <main class="foodcourt category-main">
        <header id="category-header" class="foodcourt__header">
          <div class="header-left">
            <!-- <button
              type="button"
              id="header-back"
              class="header-back"
              aria-label="이전 화면으로"
            >
              <img
                src="../../shared/images/icon/arrow-back.png"
                class="arrow-back"
                alt="뒤로가기 화살표"
              />
            </button> -->
            <a href="../../index.html" aria-label="처음으로">
              <img
                src="../../shared/images/icon/icon-home.png"
                alt=""
                class="category-header-home"
              />
            </a>

            <img
              src="../../shared/images/icon/arrow-right-w.png"
              alt=""
              class="category-header-arrow-right"
            />

            <span id="header-title"></span>
          </div>
          <!-- <div class="header-right"> -->
          <button
            type="button"
            class="header-sound-toggle"
            aria-label="소리"
            aria-pressed="true"
            data-sound-off-src="../../shared/images/icon/sound_w_off.png"
          >
            <img
              src="../../shared/images/icon/sound_w.png"
              class="header-sound"
              alt=""
            />
          </button>
          <!-- </div> -->
        </header>
        <section class="foodcourt__section orderlist__view">
          <h2 class="section-title order__list-title">주문 내역을 확인해주세요</h2>

          <!-- 주문 상품 목록 -->
          <div class="order-list-wrap">
            <!-- 상품 1 -->
            <div class="order-item">
              <span class="order-item__name">능동 미나리 곰탕</span>
              <div class="order-count__wrap">
                <span class="order-item__count">1개</span>
                <span class="order-item__price">15,000원</span>
              </div>
            </div>

            <!-- 상품 2 (옵션 포함) -->
            <div class="order-item">
              <span class="order-item__name">전주비빔밥</span>
              <div class="order-count__wrap">
                <span class="order-item__count">2개</span>
                <span class="order-item__price">24,000원</span>
              </div>
            </div>
            <!-- 옵션이 있는 경우 -->
            <div class="order-item__option">
              <span>옵션: 소스 따로 주세요</span>
            </div>
          </div>

          <span class="divider"></span>

          <!-- 주문 총괄 요약 영역 -->
          <div class="order-summary-wrap">
            <!-- 총 수량 -->
            <div class="order-summary-item">
              <span class="order-summary-item__name">총 수량</span>
              <span class="order-summary-item__value">2개</span>
            </div>

            <!-- 총 결제금액 -->
            <div class="order-summary-item order-summary-item--total">
              <span class="order-summary-item__name">총 결제금액</span>
              <span class="order-summary-item__value order-summary-item__value--price">39,000원</span>
            </div>
          </div>

          <span class="divider"></span>
        </section>

        <!-- 하단 버튼 -->
        <section class="order-bar foodcourt__oderbar" aria-label="주문 관리">
          <button type="button" class="btn-action order__btn--back">돌아가기</button>
          <button type="button" class="btn-action btn-dine-in">
            먹고가기 <span class="sub-text">(다회용컵)</span>
          </button>
          <button type="button" class="btn-action btn-takeout">
            포장하기 <span class="sub-text">(일회용컵)</span>
          </button>
        </section>
      </main>
    </div>

    <!-- 결제수단 선택 팝업 -->

    <dialog id="modal-points-phone" class="modal modal--payment" aria-labelledby="points-phone-title" open>
      <div class="modal-body">
        <img src="../../shared/images/icon/icon-coin-saving.png" alt="" class="coin-saving-image" />
        <h2 id="points-complete-title" class="modal-title">적립이 완료되었습니다.</h2>

        <button type="button" class="points-confirm court__btn--active" data-open-receipt>확인</button>
      </div>
    </dialog>

    <!-- CDN -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  </body>
</html>
