<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>테이블 결제 - 나눠서 결제하기 선택화면</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="../../shared/css/common.css" />
    <link rel="stylesheet" href="./table-pay.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.9.6/lottie.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  </head>
  <body id="tablePay">
    <div class="kiosk-container">
      <!-- 메인 콘텐츠 영역 -->
      <main class="kiosk-main kiosk-screen">
        <!-- 공통헤더 -->
        <header id="category-header-horizontal" class="tablePay__header">
          <div class="header-left">
            <a href="../../index.html" aria-label="처음으로">
              <img
                src="../../shared/images/icon/icon-home.png"
                alt="" 
                class="category-header-home"
              />
            </a>
            <img
              src="../../shared/images/icon/arrow-right-w.png"
              alt=""
              class="category-header-arrow-right"
            />
            <span id="header-title"></span>
          </div>
          <button
            type="button"
            class="header-sound-toggle"
            aria-label="소리"
            aria-pressed="true"
            data-sound-off-src="../../shared/images/icon/sound_w_off.png"
          >
            <img
              src="../../shared/images/icon/sound_w.png"
              class="header-sound"
              alt=""
            />
          </button>
        </header>
      <section id="tablePay-payment-type" class="tablePayWrap tablePayWrap-dutch">
  <!-- 상단 안내 박스 -->
  <div class="completion-banner">
    <h2 class="completion-title">체험 완료</h2>
    <p class="completion-desc">
      키오스크 체험이 완료되었습니다<br>
      수고하셨습니다
    </p>
  </div>

  <!-- 중앙 일러스트 영역 -->
  <div class="completion-illustration">
    <img src="../../shared/images/icon/kiosk-gr.png" alt="교육용 키오스크 체험 완료 일러스트">
  </div>

  <!-- 하단 버튼 영역 -->
  <div class="completion-actions">
    <a href="./index.html" class="btn-action btn-retry">다시하기</a>
    <a href="../../index.html" class="btn-action btn-home">첫 화면으로 가기</a>
  </div>
      </section>
      </main>
    </div>
    <script type="text/javascript" src="../../shared/js/common.js" defer></script>
    <script type="text/javascript" src="./table-pay.js"></script>
  </body>
</html>
