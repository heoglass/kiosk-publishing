<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KTX 환불: 정보확인</title>
    <link rel="stylesheet" href="../../shared/css/localCommon.css" />
    <link rel="stylesheet" href="./ktx.css" />
  </head>
  <body id="ktxBody" page-type="ktxRe-04">
    <main class="ktx-main kiosk-screen">
      <header id="category-header">
        <div class="header-left">
          <a href="../../index.html" aria-label="처음으로">
            <img src="../../shared/images/icon/icon-home.png" alt="" class="ktx-header-home" />
          </a>
          <img src="../../shared/images/icon/arrow-right-w.png" alt="" class="ktx-header-arrow-right" />
          <span id="header-title"></span>
        </div>

        <button type="button" class="header-sound-toggle" aria-label="소리" aria-pressed="true" data-sound-off-src="../../shared/images/icon/sound_w_off.png">
            <img src="../../shared/images/icon/sound_w.png" class="header-sound" alt="소리 버튼" />
        </button>
      </header>

      <section id="ktx-start-screen" class="ktx__section ktx__section--relative" aria-label="기차KTX 환불 정보확인">
        <!-- 진행 단계 (3단계) -->
        <ol class="ktx-step ktx-step--3">
          <li class="ktx-step__item is-done">
            <span class="ktx-step__label">QR스캔</span>
            <span class="ktx-step__dot"></span>
          </li>
          <li class="ktx-step__item is-active" aria-current="step">
            <span class="ktx-step__label">정보확인</span>
            <span class="ktx-step__dot"></span>
          </li>
          <li class="ktx-step__item">
            <span class="ktx-step__label">환불처리</span>
            <span class="ktx-step__dot"></span>
          </li>
        </ol>

        <h2 class="ktx-content-subject">승차권 환불</h2>

        <div class="ktxre-ticket">
          <p class="ktxre-ticket__date">2026-11-05(목) 14:00</p>
          <p class="ktxre-ticket__train">
            <span class="ktx-badge">KTX</span>
            <span>261 일반실or특실</span>
          </p>

          <div class="ktxre-ticket__route-box">
            <p class="ktxre-ticket__route">출발지 — 도착지</p>
            <p class="ktxre-ticket__time">11:30 → 16:27</p>
          </div>

          <dl class="ktxre-ticket__info">
            <div><dt>승차권 번호</dt><dd id="ktxReTicketNo">1234-5678-9012-34</dd></div>
            <div><dt>예약 정보</dt><dd>어른 1명/일반실</dd></div>
            <div><dt>결제금액</dt><dd>30,000원</dd></div>
            <div><dt>결제수단</dt><dd>신용카드/1234*********234</dd></div>
          </dl>
        </div>

        <p class="ktxre-notice">환불 취소승차권은 원복이 불가능합니다<br />신중하게 확인 후 진행해지기 바랍니다</p>

        <div class="ktxre-actions">
          <a href="./index.html" class="ktxre-actions__cancel">취소</a>
          <a href="./ktxRe-05.html" class="ktxre-actions__ok">확인</a>
        </div>

        <!-- 하단 바 -->
        <div class="ktx-help ktx-help--home">
          <a href="./index.html" class="ktx-help__btn ktx-help__btn--prev" data-ktx-reset>처음으로</a>
          <a href="./ktxRe-02.html" class="ktx-help__btn ktx-help__btn--prev">이전으로</a>
          <button type="button" class="ktx-help__btn">
            <img src="../../shared/images/ktx/tell.png" alt="원격상담 아이콘" class="ktx-help__icon" />
            <span>원격 상담</span>
          </button>
        </div>
      </section>

    </main>

    <script type="text/javascript" src="../../shared/js/common.js"></script>
    <script type="text/javascript" src="./ktx.js"></script>
  </body>
</html>
