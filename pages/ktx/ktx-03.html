<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KTX 예매: 인원선택 화면</title>
    <link rel="stylesheet" href="../../shared/css/localCommon.css" />
    <link rel="stylesheet" href="./ktx.css" />
  </head>
  <body id="ktxBody" page-type="ktx-03">
    <main class="ktx-main kiosk-screen">
      <header id="category-header" inert>
        <div class="header-left">
          <a href="../../index.html" aria-label="처음으로">
            <img src="../../shared/images/icon/icon-home.png" alt="" class="ktx-header-home" />
          </a>
          <img src="../../shared/images/icon/arrow-right-w.png" alt="" class="ktx-header-arrow-right" />
          <span id="header-title"></span>
        </div>

        <button type="button" class="header-sound-toggle" aria-label="소리" aria-pressed="true" data-sound-off-src="../../shared/images/icon/sound_w_off.png">
            <img src="../../shared/images/icon/sound_w.png" class="header-sound" alt="소리 버튼" />
        </button>
      </header>

      <section id="ktx-start-screen" class="ktx__section ktx__section--bg" aria-label="기차KTX 메뉴 선택" inert>
        <!-- 진행 단계 -->
        <ol class="ktx-step">
          <li class="ktx-step__item is-active" aria-current="step">
            <span class="ktx-step__label">여정선택</span>
            <span class="ktx-step__dot"></span>
          </li>
          <li class="ktx-step__item">
            <span class="ktx-step__label">열차선택</span>
            <span class="ktx-step__dot"></span>
          </li>
          <li class="ktx-step__item">
            <span class="ktx-step__label">결제</span>
            <span class="ktx-step__dot"></span>
          </li>
          <li class="ktx-step__item">
            <span class="ktx-step__label">발권</span>
            <span class="ktx-step__dot"></span>
          </li>
        </ol>

        <!-- 타이틀 -->
        <h2 class="ktx-content-subject">여정 정보를 입력해주세요</h2>

        <div id="ktxMainForm" class="ktx-form">
          <!-- 편도 / 왕복 -->
          <div class="ktx-trip" role="tablist">
            <button type="button" class="ktx-trip__btn is-active" role="tab" aria-selected="true">편도</button>
            <button type="button" class="ktx-trip__btn" role="tab" aria-selected="false">왕복</button>
          </div>
        
          <!-- 출발지 / 도착지 -->
          <div id="ktxRoute" class="ktx-route">
            <button type="button" class="ktx-route__swap" aria-label="출발지 도착지 바꾸기">
              <img src="../../shared/images/ktx/arrow-swift.png" alt="출발지 도착지 바꾸기 아이콘" />
            </button>
            <div class="ktx-route__list">
              <button type="button" class="ktx-route__row">
                <span class="ktx-route__label">출발지</span>
                <span class="ktx-route__value">선택</span>
              </button>
              <button type="button" class="ktx-route__row">
                <span class="ktx-route__label">도착지</span>
                <span class="ktx-route__value">선택</span>
              </button>
            </div>
          </div>

          <!-- 가는날 -->
          <button id="ktxDate" type="button" class="ktx-date">
            <span class="ktx-date__label">가는날</span>
            <span class="ktx-date__value">2026-11-05 (목)</span>
          </button>

          <!-- 인원 / 좌석 -->
          <div class="ktx-select">
            <button id="ktxSelectPerson" type="button" class="ktx-select__btn">
              <img src="../../shared/images/ktx/icon-person.png" alt="" class="ktx-select__icon" />
              <span>인원</span>
            </button>
            <button id="ktxSelectSeat" type="button" class="ktx-select__btn">
              <img src="../../shared/images/ktx/icon-seat.png" alt="" class="ktx-select__icon" />
              <span>좌석</span>
            </button>
          </div>

          <!-- 열차조회 -->
          <button id="ktxSubmit" type="button" class="ktx-submit">열차조회</button>
        </div>

        <!-- 하단 바 -->
        <div class="ktx-help ktx-help--home">
          <a href="./index.html" class="ktx-help__btn ktx-help__btn--prev" data-ktx-reset>처음으로</a>
          <a href="./index.html" class="ktx-help__btn ktx-help__btn--prev">이전으로</a>
          <button type="button" class="ktx-help__btn">
            <img src="../../shared/images/ktx/tell.png" alt="원격상담 아이콘" class="ktx-help__icon" />
            <span>원격 상담</span>
          </button>
        </div>
      </section>

      <aside id="ktxModal" role="dialog" aria-modal="true" aria-labelledby="ktxPersonTitle">
        <div class="ktx-modal__box ktx-person">
          <h3 id="ktxPersonTitle" class="ktx-modal__title">인원선택</h3>
          <p class="ktx-person__description">한 번에 9명까지 예매할 수 있어요</p>
          <ul class="ktx-person__list">
            <li class="ktx-person__row" data-passenger="adult">
              <span class="ktx-person__label">어른 <small>13세 이상</small></span>
              <button type="button" data-action="minus" aria-label="어른 인원 줄이기" disabled>−</button>
              <output aria-label="어른 인원">1</output>
              <button type="button" data-action="plus" aria-label="어른 인원 늘리기" disabled>＋</button>
            </li>
            <li class="ktx-person__row" data-passenger="child">
              <span class="ktx-person__label">어린이 <small>6~12세</small></span>
              <button type="button" data-action="minus" aria-label="어린이 인원 줄이기" disabled>−</button>
              <output aria-label="어린이 인원">0</output>
              <button type="button" data-action="plus" aria-label="어린이 인원 늘리기" disabled>＋</button>
            </li>
            <li class="ktx-person__row" data-passenger="infant">
              <span class="ktx-person__label">유아 <small>6세 미만</small></span>
              <button type="button" data-action="minus" aria-label="유아 인원 줄이기" disabled>−</button>
              <output aria-label="유아 인원">0</output>
              <button type="button" data-action="plus" aria-label="유아 인원 늘리기" disabled>＋</button>
            </li>
            <li class="ktx-person__row" data-passenger="senior">
              <span class="ktx-person__label">경로 <small>65세 이상</small></span>
              <button type="button" data-action="minus" aria-label="경로 인원 줄이기" disabled>−</button>
              <output aria-label="경로 인원">0</output>
              <button type="button" data-action="plus" aria-label="경로 인원 늘리기" disabled>＋</button>
            </li>
            <li class="ktx-person__row" data-passenger="severeDisability">
              <span class="ktx-person__label">중증장애인</span>
              <button type="button" data-action="minus" aria-label="중증장애인 인원 줄이기" disabled>−</button>
              <output aria-label="중증장애인 인원">0</output>
              <button type="button" data-action="plus" aria-label="중증장애인 인원 늘리기" disabled>＋</button>
            </li>
            <li class="ktx-person__row" data-passenger="severeDisabilityCompanion">
              <span class="ktx-person__label">중증장애인 보호자</span>
              <button type="button" data-action="minus" aria-label="중증장애인 보호자 인원 줄이기" disabled>−</button>
              <output aria-label="중증장애인 보호자 인원">0</output>
              <button type="button" data-action="plus" aria-label="중증장애인 보호자 인원 늘리기" disabled>＋</button>
            </li>
            <li class="ktx-person__row" data-passenger="mildDisability">
              <span class="ktx-person__label">경증장애인</span>
              <button type="button" data-action="minus" aria-label="경증장애인 인원 줄이기" disabled>−</button>
              <output aria-label="경증장애인 인원">0</output>
              <button type="button" data-action="plus" aria-label="경증장애인 인원 늘리기" disabled>＋</button>
            </li>
            <li class="ktx-person__row" data-passenger="nationalMerit">
              <span class="ktx-person__label">국가유공자</span>
              <button type="button" data-action="minus" aria-label="국가유공자 인원 줄이기" disabled>−</button>
              <output aria-label="국가유공자 인원">0</output>
              <button type="button" data-action="plus" aria-label="국가유공자 인원 늘리기" disabled>＋</button>
            </li>
            <li class="ktx-person__row" data-passenger="nationalMeritCompanion">
              <span class="ktx-person__label">국가유공자 보호자</span>
              <button type="button" data-action="minus" aria-label="국가유공자 보호자 인원 줄이기" disabled>−</button>
              <output aria-label="국가유공자 보호자 인원">0</output>
              <button type="button" data-action="plus" aria-label="국가유공자 보호자 인원 늘리기" disabled>＋</button>
            </li>
            <li class="ktx-person__row" data-passenger="activeDutySoldier">
              <span class="ktx-person__label">현역병</span>
              <button type="button" data-action="minus" aria-label="현역병 인원 줄이기" disabled>−</button>
              <output aria-label="현역병 인원">0</output>
              <button type="button" data-action="plus" aria-label="현역병 인원 늘리기" disabled>＋</button>
            </li>
          </ul>
          <div class="ktx-station__actions">
            <a href="./ktx-02.html" class="ktx-station__cancel">취소</a>
            <button type="button" id="ktxPersonConfirm" disabled>확인</button>
          </div>
        </div>
      </aside>
    </main>

    <script type="text/javascript" src="../../shared/js/common.js"></script>
    <script type="text/javascript" src="./ktx.js"></script>
  </body>
</html>
