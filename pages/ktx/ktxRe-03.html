<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KTX 환불: 승차권 번호 입력</title>
    <link rel="stylesheet" href="../../shared/css/localCommon.css" />
    <link rel="stylesheet" href="./ktx.css" />
  </head>
  <body id="ktxBody" page-type="ktxRe-03">
    <main class="ktx-main kiosk-screen">
      <header id="category-header" inert>
        <div class="header-left">
          <a href="../../index.html" aria-label="처음으로">
            <img src="../../shared/images/icon/icon-home.png" alt="" class="ktx-header-home" />
          </a>
          <img src="../../shared/images/icon/arrow-right-w.png" alt="" class="ktx-header-arrow-right" />
          <span id="header-title"></span>
        </div>

        <button type="button" class="header-sound-toggle" aria-label="소리" aria-pressed="true" data-sound-off-src="../../shared/images/icon/sound_w_off.png">
            <img src="../../shared/images/icon/sound_w.png" class="header-sound" alt="소리 버튼" />
        </button>
      </header>

      <!-- 배경: ktxRe-02 화면과 동일 -->
      <section id="ktx-start-screen" class="ktx__section ktx__section--relative" aria-label="기차KTX 환불 QR스캔" inert>
        <!-- 진행 단계 (3단계) -->
        <ol class="ktx-step ktx-step--3">
          <li class="ktx-step__item is-active" aria-current="step">
            <span class="ktx-step__label">QR스캔</span>
            <span class="ktx-step__dot"></span>
          </li>
          <li class="ktx-step__item">
            <span class="ktx-step__label">정보확인</span>
            <span class="ktx-step__dot"></span>
          </li>
          <li class="ktx-step__item">
            <span class="ktx-step__label">환불처리</span>
            <span class="ktx-step__dot"></span>
          </li>
        </ol>

        <h2 class="ktx-content-subject">승차권 환불</h2>

        <p class="ktxre-qr__title">QR리더기에<br />승차권 QR코드를 스캔해주세요</p>
        <p class="ktxre-qr__desc">화면이 어두울 경우 인식이 안될 수 있습니다</p>
        <img src="../../shared/images/ktx/qr1.png" alt="승차권 QR코드를 QR리더기에 스캔하는 모습" class="ktxre-qr__img" />

        <a href="./ktxRe-03.html" class="ktxre-wide-btn ktxre-wide-btn--primary ktxre-qr__input">승차권 번호 직접 입력하기</a>
        <a href="./index.html" class="ktxre-wide-btn ktxre-wide-btn--cancel ktxre-qr__cancel">취소</a>

        <!-- 하단 바 -->
        <div class="ktx-help">
          <a href="./index.html" class="ktx-help__btn ktx-help__btn--prev">이전으로</a>
          <button type="button" class="ktx-help__btn">
            <img src="../../shared/images/ktx/tell.png" alt="원격상담 아이콘" class="ktx-help__icon" />
            <span>원격 상담</span>
          </button>
        </div>
      </section>

      <aside id="ktxModal" role="dialog" aria-modal="true" aria-labelledby="ktxTicketNoTitle">
        <div class="ktx-modal__box ktxre-ticketno">
          <h3 id="ktxTicketNoTitle" class="ktx-modal__title">승차권 번호 입력</h3>

          <div id="ktxTicketNoDisplay" class="ktxre-ticketno__display" role="status" aria-live="polite">____-____-____-____</div>

          <div class="ktx-keypad" aria-label="숫자 키패드">
            <button type="button" data-key="1">1</button>
            <button type="button" data-key="2">2</button>
            <button type="button" data-key="3">3</button>
            <button type="button" data-key="4">4</button>
            <button type="button" data-key="5">5</button>
            <button type="button" data-key="6">6</button>
            <button type="button" data-key="7">7</button>
            <button type="button" data-key="8">8</button>
            <button type="button" data-key="9">9</button>
            <button type="button" data-key="all">전체지우기</button>
            <button type="button" data-key="0">0</button>
            <button type="button" data-key="back">지우기</button>
          </div>

          <div class="ktx-station__actions">
            <a href="./ktxRe-02.html" class="ktx-station__cancel">취소</a>
            <button type="button" id="ktxTicketNoConfirm" disabled>확인</button>
          </div>
        </div>
      </aside>
    </main>

    <script type="text/javascript" src="../../shared/js/common.js"></script>
    <script type="text/javascript" src="./ktx.js"></script>
  </body>
</html>
