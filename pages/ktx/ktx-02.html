<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KTX 예매</title>
    <link rel="stylesheet" href="../../shared/css/localCommon.css" />
    <link rel="stylesheet" href="./ktx.css" />
  </head>
  <body id="ktxBody" page-type="ktx-02">
    <main class="ktx-main kiosk-screen">
      <header id="category-header">
        <div class="header-left">
          <a href="../../index.html" aria-label="처음으로">
            <img src="../../shared/images/icon/icon-home.png" alt="" class="ktx-header-home" />
          </a>
          <img src="../../shared/images/icon/arrow-right-w.png" alt="" class="ktx-header-arrow-right" />
          <span id="header-title"></span>
        </div>

        <button type="button" class="header-sound-toggle" aria-label="소리" aria-pressed="true" data-sound-off-src="../../shared/images/icon/sound_w_off.png">
            <img src="../../shared/images/icon/sound_w.png" class="header-sound" alt="소리 버튼" />
        </button>
      </header>

      <section id="ktx-start-screen" class="ktx__section ktx__section--relative" aria-label="기차KTX 메뉴 선택">
        <!-- 진행 단계 -->
        <ol class="ktx-step">
          <li class="ktx-step__item is-active" aria-current="step">
            <span class="ktx-step__label">여정선택</span>
            <span class="ktx-step__dot"></span>
          </li>
          <li class="ktx-step__item">
            <span class="ktx-step__label">열차선택</span>
            <span class="ktx-step__dot"></span>
          </li>
          <li class="ktx-step__item">
            <span class="ktx-step__label">결제</span>
            <span class="ktx-step__dot"></span>
          </li>
          <li class="ktx-step__item">
            <span class="ktx-step__label">발권</span>
            <span class="ktx-step__dot"></span>
          </li>
        </ol>

        <!-- 타이틀 -->
        <h2 class="ktx-content-subject">여정 정보를 입력해주세요</h2>

        <div id="ktxMainForm" class="ktx-form">
          <!-- 편도 / 왕복 -->
          <div class="ktx-trip" role="tablist">
            <button type="button" class="ktx-trip__btn is-active" role="tab" aria-selected="true">편도</button>
            <button type="button" class="ktx-trip__btn" role="tab" aria-selected="false">왕복</button>
          </div>
        
          <!-- 출발지 / 도착지 -->
          <div id="ktxRoute" class="ktx-route">
            <button type="button" class="ktx-route__swap" aria-label="출발지 도착지 바꾸기">
              <img src="../../shared/images/ktx/arrow-swift.png" alt="출발지 도착지 바꾸기 아이콘" />
            </button>
            <div class="ktx-route__list">
              <button type="button" class="ktx-route__row">
                <span class="ktx-route__label">출발지</span>
                <span class="ktx-route__value">선택</span>
              </button>
              <button type="button" class="ktx-route__row">
                <span class="ktx-route__label">도착지</span>
                <span class="ktx-route__value">선택</span>
              </button>
            </div>
          </div>

          <!-- 가는날 -->
          <button id="ktxDate" type="button" class="ktx-date">
            <span class="ktx-date__label">가는날</span>
            <span class="ktx-date__value">2026-11-05 (목)</span>
          </button>

          <!-- 인원 / 좌석 -->
          <div class="ktx-select">
            <button id="ktxSelectPerson" type="button" class="ktx-select__btn">
              <img src="../../shared/images/ktx/person.png" alt="인원" class="ktx-select__icon" />
              <span>인원</span>
            </button>
            <button id="ktxSelectSeat" type="button" class="ktx-select__btn">
              <img src="../../shared/images/ktx/seat__index.png" alt="좌석 선택" class="ktx-select__icon" />
              <span>좌석</span>
            </button>
          </div>

          <!-- 열차조회 -->
          <button id="ktxSubmit" type="button" class="ktx-submit">열차조회</button>
        </div>

        <!-- 하단 바 -->
        <div class="ktx-help ktx-help--home">
          <a href="./index.html" class="ktx-help__btn ktx-help__btn--prev" data-ktx-reset>처음으로</a>
          <a href="./index.html" class="ktx-help__btn ktx-help__btn--prev">이전으로</a>
          <button type="button" class="ktx-help__btn">
            <img src="../../shared/images/ktx/tell.png" alt="원격상담 아이콘" class="ktx-help__icon" />
            <span>원격 상담</span>
          </button>
        </div>
      </section>

      <aside id="ktxModal">
        <div class="ktx-modal__box">
          <h3 id="ktxModalTitle" class="ktx-modal__title">기차/KTX</h3>
          <p class="ktx-modal__timer"><span id="ktxModalCount">30</span>초 후 종료됩니다</p>
        
          <button type="button" class="ktx-modal__confirm" id="ktxModalConfirm">확인</button>
        </div>
      </aside>
    </main>

    <script type="text/javascript" src="../../shared/js/common.js"></script>
    <script type="text/javascript" src="./ktx.js"></script>
  </body>
</html>
