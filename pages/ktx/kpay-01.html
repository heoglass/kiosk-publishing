<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KTX 예매: 결제수단 선택</title>
    <link rel="stylesheet" href="../../shared/css/localCommon.css" />
    <link rel="stylesheet" href="./ktx.css" />
  </head>
  <body id="ktxBody" page-type="kpay-01">
    <main class="ktx-main kiosk-screen">
      <header id="category-header">
        <div class="header-left">
          <a href="../../index.html" aria-label="처음으로">
            <img src="../../shared/images/icon/icon-home.png" alt="" class="ktx-header-home" />
          </a>
          <img src="../../shared/images/icon/arrow-right-w.png" alt="" class="ktx-header-arrow-right" />
          <span id="header-title"></span>
        </div>

        <button type="button" class="header-sound-toggle" aria-label="소리" aria-pressed="true" data-sound-off-src="../../shared/images/icon/sound_w_off.png">
            <img src="../../shared/images/icon/sound_w.png" class="header-sound" alt="소리 버튼" />
        </button>
      </header>

      <section id="ktx-start-screen" class="ktx__section ktx__section--relative" aria-label="기차KTX 결제수단 선택">
        <!-- 진행 단계 : 여정선택·열차선택 완료(is-done), 결제 진행중(is-active) -->
        <ol class="ktx-step">
          <li class="ktx-step__item is-done">
            <span class="ktx-step__label">여정선택</span>
            <span class="ktx-step__dot"></span>
          </li>
          <li class="ktx-step__item is-done">
            <span class="ktx-step__label">열차선택</span>
            <span class="ktx-step__dot"></span>
          </li>
          <li class="ktx-step__item is-active" aria-current="step">
            <span class="ktx-step__label">결제</span>
            <span class="ktx-step__dot"></span>
          </li>
          <li class="ktx-step__item">
            <span class="ktx-step__label">발권</span>
            <span class="ktx-step__dot"></span>
          </li>
        </ol>

        <!-- 타이틀 (시안 문구 그대로) -->
        <h2 class="ktx-content-subject">여정 정보를 입력해주세요</h2>

        <!-- 결제 금액 -->
        <dl class="ktx-pay-summary">
          <div class="ktx-pay-summary__row">
            <dt>운임</dt>
            <dd>14,000원</dd>
          </div>
          <div class="ktx-pay-summary__row">
            <dt>요금</dt>
            <dd>0원</dd>
          </div>
          <div class="ktx-pay-summary__row">
            <dt>할인</dt>
            <dd>-0원</dd>
          </div>
          <div class="ktx-pay-summary__row ktx-pay-summary__row--total">
            <dt>총 결제금액</dt>
            <dd id="ktxPayTotal" data-amount="14000">14,000원</dd>
          </div>
        </dl>

        <!-- 결제 수단 -->
        <div class="ktx-pay-methods">
          <button type="button" class="ktx-pay-method" data-pay-method="simple" data-next="./kpay-02.html">
            <strong>간편결제</strong>
            <img src="../../shared/images/ktx/zero.png" alt="제로페이" class="ktx-pay-method__logo ktx-pay-method__logo--zero" />
          </button>

          <button type="button" class="ktx-pay-method active" data-pay-method="domestic" data-next="./kpay-02.html">
            <strong>국내 신용카드</strong>
            <span>(삼성/애플페이)</span>
          </button>

          <div class="ktx-pay-methods__half">
            <button type="button" class="ktx-pay-method ktx-pay-method--half" data-pay-method="overseas" data-next="./kpay-02.html">
              <strong>해외 신용카드</strong>
              <span class="ktx-pay-method__logos">
                <img src="../../shared/images/ktx/badge_.png" alt="마스터카드" />
              </span>
            </button>
            <button type="button" class="ktx-pay-method ktx-pay-method--half" data-pay-method="unionpay" data-next="./kpay-02.html">
              <strong>유니온페이</strong>
              <span class="ktx-pay-method__logos">
                <img src="../../shared/images/ktx/union.png" alt="유니온페이" />
              </span>
            </button>
          </div>

          <button type="button" class="ktx-pay-method" data-pay-method="mileage">
            <strong>KTX 마일리지</strong>
            <span>(혼용결제)</span>
          </button>
        </div>

        <!-- 이전으로 -->
        <a href="./ktx-12.html" class="ktx-pay-prev">이전으로</a>

        <!-- 하단 바 -->
        <div class="ktx-help ktx-help--home">
          <a href="./index.html" class="ktx-help__btn ktx-help__btn--prev" data-ktx-reset>처음으로</a>
          <p class="ktx-help__text">기기 사용에 어려움이 있다면?</p>
          <button type="button" class="ktx-help__btn">
            <img src="../../shared/images/ktx/tell.png" alt="원격상담 아이콘" class="ktx-help__icon" />
            <span>원격 상담</span>
          </button>
        </div>
      </section>
    </main>

    <script type="text/javascript" src="../../shared/js/common.js"></script>
    <script type="text/javascript" src="./ktx.js"></script>
  </body>
</html>
