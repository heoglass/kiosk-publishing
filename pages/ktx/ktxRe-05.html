<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KTX 환불: 환불 진행 확인</title>
    <link rel="stylesheet" href="../../shared/css/localCommon.css" />
    <link rel="stylesheet" href="./ktx.css" />
  </head>
  <body id="ktxBody" page-type="ktxRe-05">
    <main class="ktx-main kiosk-screen">
      <header id="category-header">
        <div class="header-left">
          <a href="../../index.html" aria-label="처음으로">
            <img src="../../shared/images/icon/icon-home.png" alt="" class="ktx-header-home" />
          </a>
          <img src="../../shared/images/icon/arrow-right-w.png" alt="" class="ktx-header-arrow-right" />
          <span id="header-title"></span>
        </div>

        <button type="button" class="header-sound-toggle" aria-label="소리" aria-pressed="true" data-sound-off-src="../../shared/images/icon/sound_w_off.png">
            <img src="../../shared/images/icon/sound_w.png" class="header-sound" alt="소리 버튼" />
        </button>
      </header>

      <section id="ktx-start-screen" class="ktx__section ktx__section--relative" aria-label="기차KTX 환불 진행 확인">
        <!-- 진행 단계 (3단계) -->
        <ol class="ktx-step ktx-step--3">
          <li class="ktx-step__item is-done">
            <span class="ktx-step__label">QR스캔</span>
            <span class="ktx-step__dot"></span>
          </li>
          <li class="ktx-step__item is-done">
            <span class="ktx-step__label">정보확인</span>
            <span class="ktx-step__dot"></span>
          </li>
          <li class="ktx-step__item is-active" aria-current="step">
            <span class="ktx-step__label">환불처리</span>
            <span class="ktx-step__dot"></span>
          </li>
        </ol>

        <h2 class="ktx-content-subject">승차권 환불을 진행하시겠습니까?</h2>

        <div class="ktxre-fare">
          <dl class="ktxre-fare__rows">
            <div class="ktxre-fare__row"><dt>운임</dt><dd>25,000원</dd></div>
            <div class="ktxre-fare__row"><dt>요금</dt><dd>5,000원</dd></div>
            <div class="ktxre-fare__row"><dt>결제금액</dt><dd>30,000원</dd></div>
            <div class="ktxre-fare__row"><dt>환불 위약금</dt><dd>0원</dd></div>
          </dl>
          <p class="ktxre-fare__total"><span>환불금액</span><strong>30,000원</strong></p>
        </div>

        <div class="ktxre-actions ktxre-actions--bottom">
          <a href="./index.html" class="ktxre-actions__cancel">취소</a>
          <a href="./ktxRe-06.html" class="ktxre-actions__ok">확인</a>
        </div>

        <!-- 하단 바 -->
        <div class="ktx-help">
          <a href="./ktxRe-04.html" class="ktx-help__btn ktx-help__btn--prev">이전으로</a>
          <button type="button" class="ktx-help__btn">
            <img src="../../shared/images/ktx/tell.png" alt="원격상담 아이콘" class="ktx-help__icon" />
            <span>원격 상담</span>
          </button>
        </div>
      </section>

    </main>

    <script type="text/javascript" src="../../shared/js/common.js"></script>
    <script type="text/javascript" src="./ktx.js"></script>
  </body>
</html>
