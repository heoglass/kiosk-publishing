<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>고속/시외버스</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="../../shared/css/common.css" />
    <link rel="stylesheet" href="./express-bus.css" />
    <script
      type="text/javascript"
      src="../../shared/js/common.js"
      defer=""
    ></script>
    <script type="text/javascript" src="./express-bus.js" defer=""></script>
  </head>
  <body>
    <main class="bus-main kiosk-screen">
      <header id="category-header" class="bus__header">
        <div class="header-left">
          <!-- <button
            type="button"
            id="header-back"
            class="header-back"
            aria-label="이전 화면으로"
          >
            <img
              src="../../shared/images/icon/arrow-back.png"
              class="arrow-back"
              alt="뒤로가기 화살표"
            />
          </button> -->
          <a href="../../index.html" aria-label="처음으로">
            <img
              src="../../shared/images/icon/icon-home.png"
              alt=""
              class="category-header-home"
            />
          </a>
          <img
            src="../../shared/images/icon/arrow-right-w.png"
            alt=""
            class="category-header-arrow-right"
          />
          <span id="header-title"></span>
        </div>
        <!-- <div class="header-right"> -->
        <button
          type="button"
          class="header-sound-toggle"
          aria-label="소리"
          aria-pressed="true"
          data-sound-off-src="../../shared/images/icon/sound_w_off.png"
        >
          <img
            src="../../shared/images/icon/sound_w.png"
            class="header-sound"
            alt=""
          />
        </button>
        <!-- </div> -->
      </header>
      <section id="screen-bus-main" class="screen-bus-ticket-complete">
        <div class="contens-top">
          <div class="location-time-bar">
            <div class="location-container">
              <img
                src="../../shared/images/express-bus/location-w.png"
                alt=""
              />
              <p>서울</p>
            </div>
            <div class="time-container">
              <p class="top-date">2026-11-09 월요일</p>
              <p class="top-time">현재 시간 <span>09:45</span></p>
            </div>
          </div>
          <div class="contents-center">
            <div class="title-container page7">
              <p class="page-title">이용해 주셔서 감사합니다</p>
              <p class="page-dexcription">
                출력된 승차권을 확인하여 주십시오<br />
                승차권에 문제에 있을 경우 창구로 문의하여 주십시오
              </p>
            </div>
            <div
              class="bus-ticket-wrap bus-ticket-paper"
              role="group"
              aria-label="시외/고속버스 승차권"
            >
              <div class="bus-ticket-paper-header">
                <img
                  src="../../shared/images/express-bus/icon-bus-w.png"
                  alt=""
                  class="bus-ticket-paper-icon"
                />
                <p>시외/고속버스 승차권</p>
              </div>
              <div class="bus-ticket-paper-body">
                <div
                  class="bus-ticket-paper-route"
                  aria-label="출발지에서 도착지까지"
                >
                  <span class="bus-ticket-paper-departure">출발지</span>
                  <span class="bus-ticket-paper-arrow" aria-hidden="true">
                    <img
                      src="../../shared/images/express-bus/arrow-right-85.png"
                      alt=""
                    />
                  </span>
                  <span class="bus-ticket-paper-arrival">도착지</span>
                </div>
                <dl class="bus-ticket-paper-details">
                  <div class="bus-ticket-paper-detail-row">
                    <dt>출발일</dt>
                    <dd>2025.03.12(토)</dd>
                  </div>
                  <div class="bus-ticket-paper-detail-row">
                    <dt>출발시간</dt>
                    <dd>12:00</dd>
                  </div>
                  <div class="bus-ticket-paper-detail-row">
                    <dt>좌석</dt>
                    <dd>54C</dd>
                  </div>
                </dl>
                <img
                  src="../../shared/images/express-bus/bus-ticket-barcode.png"
                  alt="승차권 바코드"
                  class="bus-ticket-paper-barcode"
                />
              </div>
            </div>
          </div>
        </div>
        <div class="contens-bottom">
          <div class="bottom-button-container">
            <a
              type="button"
              href="./express-bus_08.html"
              class="bottom-button confirm"
            >
              확인
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
