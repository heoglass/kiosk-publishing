<!DOCTYPE html>

<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>고속/시외버스</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="../../shared/css/common.css" />
    <link rel="stylesheet" href="./express-bus.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.9.6/lottie.min.js"></script>
    <script src="../../shared/images/lottie/lottie-card-insert.js"></script>
    <script type="text/javascript" src="./express-bus.js" defer=""></script>
    <script
      type="text/javascript"
      src="../../shared/js/common.js"
      defer=""
    ></script>
  </head>

  <body>
    <main class="bus-main kiosk-screen">
      <header id="category-header" class="bus__header">
        <div class="header-left">
          <a href="../../index.html" aria-label="처음으로">
            <img
              src="../../shared/images/icon/icon-home.png"
              alt=""
              class="category-header-home"
            />
          </a>

          <img
            src="../../shared/images/icon/arrow-right-w.png"
            alt=""
            class="category-header-arrow-right"
          />

          <span id="header-title"></span>
        </div>
        <button
          type="button"
          class="header-sound-toggle"
          aria-label="소리"
          aria-pressed="true"
          data-sound-off-src="../../shared/images/icon/sound_w_off.png"
        >
          <img
            src="../../shared/images/icon/sound_w.png"
            class="header-sound"
            alt=""
          />
        </button>
      </header>

      <section id="screen-bus-main" class="screen-bus-card-insert">
        <div class="contens-top">
          <div class="location-time-bar">
            <div class="location-container">
              <img
                src="../../shared/images/express-bus/location-w.png"
                alt=""
              />

              <p>서울</p>
            </div>

            <div class="time-container">
              <p class="top-date">2026-11-09 월요일</p>

              <p class="top-time">현재 시간 <span>09:45</span></p>
            </div>
          </div>

          <div class="title-container">
            <p class="page-title">IC 카드를 투입구 끝까지 밀어 넣어주세요</p>
          </div>

          <div class="contens-center">
            <button
              type="button"
              class="payment-image-button"
              data-card-inserted
              data-cafe-next="modal-payment-progress"
              aria-label="카드 삽입"
            >
              <div
                id="lottie-card-insert"
                class="card-payment-image card-insert"
              ></div>
            </button>

            <div class="center-text-area">
              <p class="center-title">카드를 투입구에 넣어주세요</p>

              <p class="center-description">
                삼성/애플페이로 결제시 결제화면을 실행 후 <br />

                휴대폰을 투입구 가까이에 갖다대세요
              </p>
            </div>

            <!-- 05 화면: 하드코딩 결제 정보 -->
            <div class="bus-payment-summary" aria-label="승차권 결제 정보">
              <div class="bus-payment-summary-top">
                <div class="bus-payment-route">
                  <span
                    class="bus-payment-route-line"
                    aria-hidden="true"
                  ></span>
                  <p class="bus-payment-terminal">출발지명</p>
                  <p class="bus-payment-duration">평균 2시간 소요</p>
                  <p class="bus-payment-terminal">도착지명</p>
                </div>
                <dl class="bus-payment-details">
                  <div class="bus-payment-detail-row">
                    <dt>버스회사</dt>
                    <dd>금호</dd>
                  </div>
                  <div class="bus-payment-detail-row">
                    <dt>버스등급</dt>
                    <dd>우등</dd>
                  </div>
                  <div class="bus-payment-detail-row">
                    <dt>좌석번호</dt>
                    <dd>7,8</dd>
                  </div>
                  <div class="bus-payment-detail-row">
                    <dt>티켓수량</dt>
                    <dd>2(일반1,초등1)</dd>
                  </div>
                </dl>
              </div>
              <div class="bus-payment-total">
                <p class="bus-payment-total-title">총 결제금액</p>
                <p class="bus-payment-total-price">39,000원</p>
              </div>
            </div>
          </div>
        </div>

        <div class="contens-bottom">
          <div class="bottom-button-container">
            <a type="button" href="" class="bottom-button"> 결제 취소 </a>
          </div>
        </div>
      </section>

      <!-- 이미지 클릭 시 표시하는 카드 제거 안내 팝업 -->
      <dialog
        id="bus-card-confirm-dialog"
        class="bus-card-confirm-dialog"
        aria-labelledby="bus-card-confirm-title"
      >
        <div class="bus-card-confirm-content">
          <h2 id="bus-card-confirm-title" class="bus-card-confirm-title">
            결제하신 카드를 리더기에서 꺼낸 후,<br />
            [확인]버튼을 누르면 승차권이 나옵니다
          </h2>
          <button type="button" class="bus-card-confirm-button" autofocus>
            확인
          </button>
        </div>
      </dialog>
    </main>
  </body>
</html>
