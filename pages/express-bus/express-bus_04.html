                    src="../../shared/images/express-bus/seat-default.png"
                    alt=""
                  />
                  <span class="bus-seat-number">45</span>
                </button>
              </div>
            </div>
          </div>
          <aside class="bus-seat-side" aria-label="좌석 선택 정보">
            <div class="bus-seat-legend" aria-label="좌석 표시 안내">
              <div class="bus-seat-legend-item">
                <span class="bus-seat-legend-icon">
                  <img
                    src="../../shared/images/express-bus/seat-default.png"
                    alt=""
                  />
                  <span class="bus-seat-legend-number">1</span>
                </span>
                <span>선택가능<br />좌석</span>
              </div>
              <div class="bus-seat-legend-item">
                <span class="bus-seat-legend-icon bus-seat-legend-sold">
                  <img
                    src="../../shared/images/express-bus/seat-disabled.png"
                    alt=""
                  />
                </span>
                <span>판매된<br />좌석</span>
              </div>
              <div class="bus-seat-legend-item">
                <span class="bus-seat-legend-icon">
                  <img
                    src="../../shared/images/express-bus/seat-selected.png"
                    alt=""
                  />
                </span>
                <span>선택한<br />좌석</span>
              </div>
            </div>
            <div class="bus-seat-side-content">
              <div class="bus-seat-prompt">
                <div class="bus-seat-prompt-arrow" aria-hidden="true">
                  <img
                    src="../../shared/images/express-bus/arrow-left-yellow1.png"
                    alt=""
                  />
                  <img
                    src="../../shared/images/express-bus/arrow-left-yellow2.png"
                    alt=""
                  />
                  <span>좌석을 선택하세요</span>
                </div>
              </div>
              <div class="bus-passenger-picker" hidden>
                <p class="bus-passenger-title">선택해주세요</p>
                <div
                  class="bus-passenger-options"
                  role="group"
                  aria-label="선택 좌석의 승객 유형"
                >
                  <button
                    type="button"
                    class="bus-passenger-button"
                    data-passenger="adult"
                    aria-pressed="false"
                  >
                    일반
                  </button>
                  <button
                    type="button"
                    class="bus-passenger-button"
                    data-passenger="child"
                    aria-pressed="false"
                  >
                    초등생
                  </button>
                  <button
                    type="button"
                    class="bus-passenger-button"
                    data-passenger="student"
                    aria-pressed="false"
                  >
                    중등생
                  </button>
                  <button
                    type="button"
                    class="bus-passenger-button"
                    data-passenger="veteran30"
                    aria-pressed="false"
                  >
                    보훈30
                  </button>
                  <button
                    type="button"
                    class="bus-passenger-button"
                    data-passenger="veteran50"
                    aria-pressed="false"
                  >
                    보훈50
                  </button>
                  <button
                    type="button"
                    class="bus-passenger-button bus-passenger-cancel"
                    data-passenger-cancel
                  >
                    취소
                  </button>
                </div>
              </div>
              <ul
                class="bus-selected-seat-list"
                aria-label="선택한 좌석 목록"
                hidden
              ></ul>
              <p class="bus-seat-notice">
                승차권 1매<br />최대 발권 매수는 10매입니다
              </p>
              <p class="bus-seat-status" role="status" aria-live="polite"></p>
            </div>
            <div class="bus-seat-payment" aria-live="polite" aria-atomic="true">
              <p class="bus-seat-payment-title">총 결제 금액</p>
              <p class="bus-seat-payment-total">0원</p>
            </div>
          </aside>
        </div>

        <div class="contens-bottom page4">
          <div class="bottom-button-container two-btn">
            <a
              type="button"
              href="./express-bus_03.html"
              class="bottom-button back"
            >
              이전
            </a>

            <button type="button" class="bottom-button completed" disabled>
              선택 완료
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
