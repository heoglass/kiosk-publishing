<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, initial-scale=1.0">
    <title>은행 ATM</title>
    <link rel="stylesheet" href="../../shared/css/LocalCommon.css" />
    <link rel="stylesheet" href="./atmBank.css" />

  </head>
  <body id="bankAtmBody" data-page="atm-index">
    <!-- 메인 콘텐츠 영역 -->
    <main class="kiosk-main atm__screen">
      <!-- 가로형 공통헤더 -->
      <header id="category-header-horizontal" class="tablePay__header--bank">
        <div class="header-left">
          <a href="../../index.html" aria-label="처음으로">
            <img src="../../shared/images/icon/icon-home.png" alt="" class="category-header-home" />
          </a>
          <img src="../../shared/images/icon/arrow-right-w.png" alt="" class="category-header-arrow-right" />
          <span id="header-title"></span>
        </div>
        <!-- <div class="header-right"> -->
        <button type="button" class="header-sound-toggle" aria-label="소리" aria-pressed="true" data-sound-off-src="../../shared/images/icon/sound_w_off.png">
          <img src="../../shared/images/icon/sound_w.png" class="header-sound" alt="" />
        </button>
      </header>

      <section class="kiosk-container atm__section atm-14">
        <div class="atm__subject">
          <h2>비밀번호 입력</h2>
          <h3 class="atmg__desc">
            <span class="atmg__warn">불법 카메라</span>를 설치하여 비밀번호를 <span class="atmg__warn">탈취</span>하는 사례가 발생할 수 있으니,<br />
            비밀 번호 입력 시 <span class="atmg__underline">반드시 가리고</span> 입력해주세요
          </h3>
        </div>

        <!-- 4자리 입력 완료 시 data-pin-next 경로로 자동 이동 -->
        <div class="atm__content atmg__content--pin" data-pin-length="4" data-pin-next="./atm-15.html">
          <div class="atmg__pin-display" aria-live="polite" aria-label="비밀번호 입력 칸"></div>

          <div class="atmg__keypad">
            <button type="button" class="atmg__key" data-key="1">1</button>
            <button type="button" class="atmg__key" data-key="2">2</button>
            <button type="button" class="atmg__key" data-key="3">3</button>
            <button type="button" class="atmg__key" data-key="4">4</button>
            <button type="button" class="atmg__key" data-key="5">5</button>
            <button type="button" class="atmg__key" data-key="6">6</button>
            <button type="button" class="atmg__key" data-key="7">7</button>
            <button type="button" class="atmg__key" data-key="8">8</button>
            <button type="button" class="atmg__key" data-key="9">9</button>
            <button type="button" class="atmg__key" data-action="shuffle">재배열</button>
            <button type="button" class="atmg__key" data-key="0">0</button>
            <button type="button" class="atmg__key" data-action="back" aria-label="지우기">
              <svg class="atmg__key-icon" width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
                <path d="M22 13H4M12 5L4 13l8 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
        </div>

        <div class="atm__buttons atmg__buttons--narrow atmg__buttons--stack">
          <a href="./index.html" class="atm-btn atmg__btn--wide" data-pin-complete>거래취소</a>
        </div>
      </section>
    </main>
    <script type="text/javascript" src="../../shared/js/common.js" defer></script>
    <script type="text/javascript" src="./atmBank.js"></script>
  </body>
</html>
