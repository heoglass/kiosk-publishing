          </div>

          <!-- 기내 구역 -->
          <div class="air-cabin">
            <span class="air-cabin__cap air-cabin__cap--front">앞</span>
            <ul class="air-cabin__list">
              <li><button type="button" class="air-cabin__zone" data-zone="A" disabled><strong class="air-cabin__name">A</strong><span class="air-cabin__remain">잔여 <em>0</em>석</span></button></li>
